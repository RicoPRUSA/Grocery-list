<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista 🇵🇷 | Grocery App</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        .profound-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.07), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        
        .scale-in { animation: scaleIn 0.25s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        @keyframes scaleIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Plus: <path d="M12 5v14M5 12h14" />,
                Minus: <path d="M5 12h14" />,
                Trash2: (<><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></>),
                Check: <path d="M20 6 9 17l-5-5" />,
                X: (<><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>),
                ShoppingCart: (<><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></>),
                Menu: (<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>),
                Search: (<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>),
                Upload: (<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></>),
                Download: (<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>),
                Package: (<><path d="m16.5 9.4-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.27 6.96 8.73 5.05 8.73-5.05M12 22.08V12"/></>),
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const GroceryListApp = () => {
            const [items, setItems] = useState([]);
            const [pantryItems, setPantryItems] = useState([]);
            const [editingItem, setEditingItem] = useState(null);
            const [showMenu, setShowMenu] = useState(false);
            const [showPantry, setShowPantry] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const searchRef = useRef(null);

            const aisleMap = {
                '🥦 Produce': ['apple', 'banana', 'orange', 'lettuce', 'tomato', 'onion', 'potato', 'carrot', 'cilantro', 'lime', 'lemon', 'garlic', 'pepper', 'fruit', 'veggie', 'recao', 'aguacate', 'plátano', 'guineo'],
                '🥩 Meat': ['chicken', 'beef', 'pork', 'turkey', 'fish', 'steak', 'bacon', 'ham', 'chorizo', 'sausage', 'ground', 'pollo', 'carne', 'jamón', 'chuleta', 'pavo'],
                '🥛 Dairy': ['milk', 'egg', 'cheese', 'butter', 'yogurt', 'cream', 'half', 'sour cream', 'leche', 'huevo', 'queso', 'mantequilla'],
                '🍞 Bakery': ['bread', 'bagel', 'muffin', 'cake', 'tortilla', 'pan', 'roll', 'bizcocho', 'sobao'],
                '🥫 Canned': ['soup', 'beans', 'corn', 'tuna', 'sauce', 'tomato paste', 'habichuela', 'salsa', 'gandules', 'salchicha'],
                '🍝 Pantry': ['rice', 'pasta', 'cereal', 'flour', 'sugar', 'oil', 'salt', 'pepper', 'spices', 'honey', 'vinegar', 'adobo', 'sazon', 'arroz', 'aceite', 'azúcar', 'avena', 'café', 'coffee'],
                '🥤 Beverages': ['water', 'juice', 'soda', 'coffee', 'beer', 'wine', 'malta', 'drink', 'agua', 'jugo', 'refresco', 'cerveza'],
                '❄️ Frozen': ['ice cream', 'frozen', 'pizza', 'fries', 'nugget', 'helado', 'congelado'],
                '🥨 Snacks': ['chips', 'crackers', 'cookies', 'candy', 'popcorn', 'nuts', 'galletas', 'papas'],
                '🧼 Pharmacy': ['shampoo', 'soap', 'medicine', 'vitamin', 'toothpaste', 'aspirin', 'deodorant', 'jabón', 'pasta de dientes']
            };

            const getAisleForItem = (itemName) => {
                if (!itemName) return '📦 Other';
                const lowerName = itemName.toLowerCase();
                for (const [aisle, keywords] of Object.entries(aisleMap)) {
                    if (keywords.some(keyword => lowerName.includes(keyword))) return aisle;
                }
                return '📦 Other';
            };

            useEffect(() => {
                const savedItems = localStorage.getItem('groceryItems');
                const savedPantry = localStorage.getItem('pantryItems');
                if (savedItems) setItems(JSON.parse(savedItems));
                if (savedPantry) setPantryItems(JSON.parse(savedPantry));
            }, []);

            useEffect(() => { localStorage.setItem('groceryItems', JSON.stringify(items)); }, [items]);
            useEffect(() => { localStorage.setItem('pantryItems', JSON.stringify(pantryItems)); }, [pantryItems]);

            const addItemManually = (name) => {
                if (!name.trim()) return;
                const item = { 
                    id: Date.now(), 
                    name: name.trim(), 
                    quantity: 1, 
                    price: '', 
                    aisle: getAisleForItem(name), 
                    checked: false 
                };
                setItems([item, ...items]);
                setSearchQuery('');
                searchRef.current?.focus();
            };

            const addItemFromPantry = (p) => {
                const item = { 
                    id: Date.now(), 
                    name: p.name, 
                    quantity: 1, 
                    price: p.price || '', 
                    aisle: p.aisle || getAisleForItem(p.name), 
                    checked: false 
                };
                setItems([item, ...items]);
                setSearchQuery('');
                searchRef.current?.focus();
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                        const newItems = jsonData.map((row, index) => {
                            const name = String(row.Item || row.Name || '').trim();
                            return { id: Date.now() + index, name, price: String(row.Price || '').trim(), aisle: row.Aisle || getAisleForItem(name) };
                        }).filter(item => item.name);
                        setPantryItems(prev => [...prev, ...newItems]);
                        setShowPantry(true);
                    } catch (err) { alert("Error reading file."); }
                };
                reader.readAsArrayBuffer(file);
            };

            const exportToExcel = () => {
                if (items.length === 0) return alert("List is empty!");
                const dataToExport = items.map(item => ({
                    Item: item.name,
                    Quantity: item.quantity,
                    Price: item.price || 0,
                    Total: (parseFloat(item.price || 0) * item.quantity).toFixed(2),
                    Aisle: item.aisle.replace(/[^a-zA-Z ]/g, "").trim(),
                    Status: item.checked ? 'Purchased' : 'Pending'
                }));
                const ws = XLSX.utils.json_to_sheet(dataToExport);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Grocery List");
                XLSX.writeFile(wb, "Mi_Lista_Grocery.xlsx");
                setShowMenu(false);
            };

            const cartTotal = items.reduce((sum, i) => sum + (parseFloat(i.price || 0) * parseFloat(i.quantity || 1)), 0);
            const groupedByAisle = items.filter(i => !i.checked).reduce((acc, i) => { (acc[i.aisle] = acc[i.aisle] || []).push(i); return acc; }, {});

            const pantryResults = searchQuery.length > 0 
                ? pantryItems.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()))
                : [];

            return (
                <div className="min-h-screen pb-32">
                    <div className="max-w-xl mx-auto p-4">
                        
                        {/* Merged Header Search/Add */}
                        <header className="rounded-3xl profound-shadow px-5 py-5 mb-8 text-white bg-gradient-to-br from-emerald-600 to-teal-800 sticky top-4 z-50">
                            <div className="flex items-center justify-between mb-5">
                                <div className="flex items-center gap-3">
                                    <div className="bg-white/20 p-2 rounded-xl"><Icon name="ShoppingCart" className="w-5 h-5" /></div>
                                    <h1 className="text-lg font-black uppercase tracking-tight">Mi Lista 🇵🇷</h1>
                                </div>
                                <button onClick={() => setShowMenu(!showMenu)} className="p-2 hover:bg-white/10 rounded-full transition-colors">
                                    <Icon name="Menu" className="w-6 h-6" />
                                </button>
                            </div>
                            
                            <div className="relative">
                                <Icon name="Search" className="absolute left-4 top-1/2 -translate-y-1/2 text-white/50 w-4 h-4" />
                                <input
                                    ref={searchRef}
                                    type="text" 
                                    value={searchQuery} 
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && addItemManually(searchQuery)}
                                    placeholder="Search or add new item..."
                                    className="w-full pl-11 pr-4 py-3.5 bg-white/10 border border-white/10 rounded-2xl text-sm placeholder-white/40 focus:outline-none focus:bg-white/20 transition-all font-medium"
                                />
                                
                                {searchQuery.length > 0 && (
                                    <div className="absolute top-full left-0 right-0 mt-3 bg-white rounded-2xl shadow-2xl border border-slate-100 z-50 max-h-[70vh] overflow-y-auto scale-in">
                                        {/* Option to add custom item */}
                                        <button 
                                            onClick={() => addItemManually(searchQuery)}
                                            className="w-full flex items-center gap-4 p-4 hover:bg-emerald-50 border-b border-slate-50 text-emerald-600 font-black text-sm text-left"
                                        >
                                            <div className="p-1.5 bg-emerald-100 rounded-lg"><Icon name="Plus" className="w-4 h-4" /></div>
                                            <span>Add "{searchQuery}" to list</span>
                                        </button>

                                        {/* Pantry results */}
                                        {pantryResults.map(p => (
                                            <button 
                                                key={p.id} 
                                                onClick={() => addItemFromPantry(p)} 
                                                className="w-full flex justify-between items-center p-4 hover:bg-slate-50 border-b border-slate-50 last:border-0 text-slate-800 text-left"
                                            >
                                                <div>
                                                    <span className="font-bold text-sm block">{p.name}</span>
                                                    <span className="text-[10px] text-slate-400 uppercase font-black tracking-wider">{p.aisle}</span>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    {p.price && <span className="text-xs text-emerald-600 font-black">${p.price}</span>}
                                                    <div className="p-1.5 bg-slate-100 text-slate-400 rounded-lg"><Icon name="Plus" className="w-4 h-4" /></div>
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </header>

                        {/* Menu Choice */}
                        {showMenu && (
                            <div className="mb-6 bg-white rounded-2xl profound-shadow border border-slate-50 overflow-hidden scale-in">
                                <button onClick={() => {setShowPantry(!showPantry); setShowMenu(false)}} className="w-full flex items-center gap-3 px-6 py-4 hover:bg-slate-50 border-b text-slate-700 font-bold text-sm">
                                    <Icon name="Package" className="w-5 h-5 text-emerald-500" /> {showPantry ? 'Hide' : 'Show'} Pantry Manager
                                </button>
                                <button onClick={exportToExcel} className="w-full flex items-center gap-3 px-6 py-4 hover:bg-slate-50 border-b text-slate-700 font-bold text-sm">
                                    <Icon name="Download" className="w-5 h-5 text-emerald-500" /> Export List to Excel
                                </button>
                                <button onClick={() => {setItems(items.filter(i => !i.checked)); setShowMenu(false)}} className="w-full flex items-center gap-3 px-6 py-4 hover:bg-slate-50 border-b text-slate-700 font-bold text-sm">
                                    <Icon name="Check" className="w-5 h-5 text-emerald-500" /> Clear Checked Items
                                </button>
                                <button onClick={() => {if(confirm('Reset all?')) {setItems([]); setPantryItems([]);} setShowMenu(false)}} className="w-full flex items-center gap-3 px-6 py-4 hover:bg-red-50 text-red-600 font-bold text-sm">
                                    <Icon name="Trash2" className="w-5 h-5" /> Reset App
                                </button>
                            </div>
                        )}

                        {/* Pantry Database Section */}
                        {showPantry && (
                            <div className="bg-white rounded-3xl profound-shadow p-5 mb-8 border border-emerald-50 scale-in">
                                <div className="flex justify-between items-center mb-5">
                                    <h2 className="font-black text-slate-700 text-[10px] uppercase tracking-[0.2em]">Pantry Database</h2>
                                    <label className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-[10px] font-black cursor-pointer flex items-center gap-2 transition-all active:scale-95">
                                        <Icon name="Upload" className="w-3 h-3" /> IMPORT FILE
                                        <input type="file" className="hidden" onChange={handleFileUpload} />
                                    </label>
                                </div>
                                <div className="max-h-64 overflow-y-auto space-y-2 custom-scrollbar pr-2">
                                    {pantryItems.length === 0 && <p className="text-center text-xs text-slate-400 py-6 italic">Database is empty.</p>}
                                    {pantryItems.map(p => (
                                        <div key={p.id} className="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100/50">
                                            <div className="flex-1 mr-4">
                                                <p className="text-xs font-bold text-slate-700">{p.name}</p>
                                                <p className="text-[9px] text-slate-400 font-black uppercase">{p.aisle}</p>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <input 
                                                    type="number" value={p.price} placeholder="0.00"
                                                    onChange={(e) => setPantryItems(pantryItems.map(x => x.id === p.id ? {...x, price: e.target.value} : x))}
                                                    className="w-16 p-2 text-[11px] font-black border border-slate-200 rounded-xl bg-white focus:ring-2 focus:ring-emerald-400 outline-none"
                                                />
                                                <button onClick={() => addItemFromPantry(p)} className="p-2 text-emerald-600 hover:bg-emerald-100 rounded-xl transition-colors"><Icon name="Plus" className="w-4 h-4"/></button>
                                                <button onClick={() => setPantryItems(pantryItems.filter(i => i.id !== p.id))} className="p-2 text-red-300 hover:text-red-500"><Icon name="X" className="w-4 h-4"/></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* List Categories */}
                        <div className="space-y-8">
                            {Object.entries(groupedByAisle).sort().map(([aisle, aisleItems]) => (
                                <div key={aisle} className="scale-in">
                                    <h3 className="px-2 mb-3 text-[10px] font-black uppercase text-slate-400 tracking-[0.3em]">{aisle}</h3>
                                    <div className="bg-white rounded-[2rem] profound-shadow border border-slate-50 divide-y divide-slate-50 overflow-hidden">
                                        {aisleItems.map(item => (
                                            <div key={item.id} className="p-5 flex gap-5 items-center group transition-colors hover:bg-slate-50/50" onClick={() => setEditingItem(item)}>
                                                <button onClick={(e) => {e.stopPropagation(); setItems(items.map(i => i.id === item.id ? {...i, checked: true} : i))}} className="w-7 h-7 rounded-xl border-2 border-slate-100 shrink-0 transition-all hover:border-emerald-500" />
                                                <div className="flex-1 min-w-0">
                                                    <p className="font-bold text-slate-700 text-sm truncate">{item.name}</p>
                                                    <div className="flex items-center gap-3 mt-1">
                                                        <span className="text-[10px] font-black text-slate-400 bg-slate-100 px-2 py-0.5 rounded-lg uppercase">x{item.quantity}</span>
                                                        {item.price && <span className="text-[10px] font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-lg tracking-wider">${(parseFloat(item.price) * item.quantity).toFixed(2)}</span>}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Purchased */}
                        {items.some(i => i.checked) && (
                            <div className="mt-12 opacity-50">
                                <h3 className="text-[10px] font-black mb-4 uppercase text-slate-300 tracking-[0.3em] px-2">Purchased</h3>
                                <div className="bg-white rounded-3xl border border-dashed border-slate-200 divide-y divide-slate-50 overflow-hidden">
                                    {items.filter(i => i.checked).map(item => (
                                        <div key={item.id} className="flex items-center gap-4 p-4">
                                            <button onClick={() => setItems(items.map(i => i.id === item.id ? {...i, checked: false} : i))} className="w-6 h-6 rounded-lg bg-emerald-500 flex items-center justify-center text-white shrink-0"><Icon name="Check" className="w-4 h-4"/></button>
                                            <span className="line-through text-xs font-semibold text-slate-400 truncate flex-1">{item.name}</span>
                                            <button onClick={() => setItems(items.filter(i => i.id !== item.id))} className="p-2 text-slate-300 hover:text-red-400"><Icon name="Trash2" className="w-4 h-4"/></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Footer Progress */}
                    {items.length > 0 && (
                        <div className="fixed bottom-0 inset-x-0 bg-white/80 backdrop-blur-xl border-t border-slate-100 py-4 px-8 z-40 shadow-[0_-15px_30px_-10px_rgba(0,0,0,0.08)]">
                            <div className="max-w-xl mx-auto flex justify-between items-center">
                                <div>
                                    <p className="text-[9px] font-black text-emerald-600 uppercase tracking-widest mb-1">Estimated Total</p>
                                    <p className="text-xl font-black text-slate-800 leading-none">${cartTotal.toFixed(2)}</p>
                                </div>
                                <div className="text-right">
                                    <div className="h-2 w-24 bg-slate-100 rounded-full mb-1.5 overflow-hidden">
                                        <div className="h-full bg-emerald-500 transition-all duration-700 ease-out shadow-[0_0_10px_rgba(16,185,129,0.5)]" style={{width: `${(items.filter(i => i.checked).length / items.length) * 100}%`}}></div>
                                    </div>
                                    <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest">
                                        {items.filter(i => i.checked).length}/{items.length} Items Done
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Edit Modal */}
                    {editingItem && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-[100] flex items-center justify-center p-6">
                            <div className="bg-white rounded-[2.5rem] p-8 w-full max-w-sm profound-shadow border border-slate-100 scale-in">
                                <h2 className="text-sm font-black text-slate-800 mb-6 uppercase tracking-widest">Edit Details</h2>
                                <div className="space-y-6">
                                    <div className="space-y-1">
                                        <label className="text-[9px] font-black text-slate-400 uppercase ml-2">Name</label>
                                        <input type="text" value={editingItem.name} onChange={e => setEditingItem({...editingItem, name: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none focus:ring-2 focus:ring-emerald-500" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1">
                                            <label className="text-[9px] font-black text-slate-400 uppercase ml-2">Quantity</label>
                                            <div className="flex items-center bg-slate-50 rounded-2xl border border-slate-100 p-1">
                                                <button onClick={() => setEditingItem({...editingItem, quantity: Math.max(1, editingItem.quantity - 1)})} className="p-3 text-slate-400"><Icon name="Minus" className="w-4 h-4"/></button>
                                                <span className="flex-1 text-center font-black text-sm">{editingItem.quantity}</span>
                                                <button onClick={() => setEditingItem({...editingItem, quantity: editingItem.quantity + 1})} className="p-3 text-slate-400"><Icon name="Plus" className="w-4 h-4"/></button>
                                            </div>
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[9px] font-black text-slate-400 uppercase ml-2">Price ($)</label>
                                            <input type="number" step="0.01" value={editingItem.price} onChange={e => setEditingItem({...editingItem, price: e.target.value})} className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-black" />
                                        </div>
                                    </div>
                                    <div className="flex gap-3 pt-4">
                                        <button onClick={() => {setItems(items.map(i => i.id === editingItem.id ? {...editingItem, aisle: getAisleForItem(editingItem.name)} : i)); setEditingItem(null);}} className="flex-1 bg-emerald-600 text-white font-black py-4 rounded-2xl uppercase text-[10px] tracking-[0.2em] active:scale-95 transition-all shadow-none">Save</button>
                                        <button onClick={() => setEditingItem(null)} className="flex-1 bg-slate-100 text-slate-400 py-4 rounded-2xl font-black uppercase text-[10px] tracking-[0.2em] transition-all shadow-none">Cancel</button>
                                    </div>
                                    <button onClick={() => {setItems(items.filter(i => i.id !== editingItem.id)); setEditingItem(null);}} className="w-full py-2 text-red-400 text-[10px] font-black uppercase tracking-widest opacity-50 hover:opacity-100">Delete Item</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GroceryListApp />);
    </script>
