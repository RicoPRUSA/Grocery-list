<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista 🇵🇷 | Grocery App</title>
    
    <!-- Browser Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .check-pop { animation: checkPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes checkPop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Plus: <path d="M12 5v14M5 12h14" />,
                Minus: <path d="M5 12h14" />,
                Trash2: (<><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></>),
                Check: <path d="M20 6 9 17l-5-5" />,
                X: (<><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>),
                ShoppingCart: (<><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></>),
                Edit2: <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />,
                Menu: (<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>),
                Search: (<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>),
                Share: (<><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></>),
                Package: (<><path d="m16.5 9.4-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.27 6.96 8.73 5.05 8.73-5.05M12 22.08V12"/></>),
                Copy: (<><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></>),
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const GroceryListApp = () => {
            const [items, setItems] = useState([]);
            const [pantryItems, setPantryItems] = useState([]);
            const [newItem, setNewItem] = useState('');
            const [newQuantity, setNewQuantity] = useState(1);
            const [newPrice, setNewPrice] = useState('');
            const [selectedStore, setSelectedStore] = useState('Walmart');
            const [editingItem, setEditingItem] = useState(null);
            const [showMenu, setShowMenu] = useState(false);
            const [showPantry, setShowPantry] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');

            const stores = ['Walmart', "Sam's Club", 'Coquito', 'Talin Market', 'Econo', 'Pueblo'];

            const aisleMap = {
                '🥦 Produce': ['apple', 'banana', 'orange', 'lettuce', 'tomato', 'onion', 'potato', 'carrot', 'cilantro', 'lime', 'lemon', 'garlic', 'pepper', 'fruit', 'veggie', 'recao', 'aguacate', 'plátano', 'guineo'],
                '🥩 Meat': ['chicken', 'beef', 'pork', 'turkey', 'fish', 'steak', 'bacon', 'ham', 'chorizo', 'sausage', 'ground', 'pollo', 'carne', 'jamón', 'chuleta', 'pavo'],
                '🥛 Dairy': ['milk', 'egg', 'cheese', 'butter', 'yogurt', 'cream', 'half', 'sour cream', 'leche', 'huevo', 'queso', 'mantequilla'],
                '🍞 Bakery': ['bread', 'bagel', 'muffin', 'cake', 'tortilla', 'pan', 'roll', 'bizcocho', 'sobao'],
                '🥫 Canned': ['soup', 'beans', 'corn', 'tuna', 'sauce', 'tomato paste', 'habichuela', 'salsa', 'gandules', 'salchicha'],
                '🍝 Pantry': ['rice', 'pasta', 'cereal', 'flour', 'sugar', 'oil', 'salt', 'pepper', 'spices', 'honey', 'vinegar', 'adobo', 'sazon', 'arroz', 'aceite', 'azúcar', 'avena', 'café', 'coffee'],
                '🥤 Beverages': ['water', 'juice', 'soda', 'coffee', 'beer', 'wine', 'malta', 'drink', 'agua', 'jugo', 'refresco', 'cerveza'],
                '❄️ Frozen': ['ice cream', 'frozen', 'pizza', 'fries', 'nugget', 'helado', 'congelado'],
                '🥨 Snacks': ['chips', 'crackers', 'cookies', 'candy', 'popcorn', 'nuts', 'galletas', 'papas'],
                '🧼 Pharmacy': ['shampoo', 'soap', 'medicine', 'vitamin', 'toothpaste', 'aspirin', 'deodorant', 'jabón', 'pasta de dientes']
            };

            const getAisleForItem = (itemName) => {
                if (!itemName) return '📦 Other';
                const lowerName = itemName.toLowerCase();
                for (const [aisle, keywords] of Object.entries(aisleMap)) {
                    if (keywords.some(keyword => lowerName.includes(keyword))) return aisle;
                }
                return '📦 Other';
            };

            useEffect(() => {
                const savedItems = localStorage.getItem('groceryItems');
                const savedPantry = localStorage.getItem('pantryItems');
                if (savedItems) setItems(JSON.parse(savedItems));
                if (savedPantry) setPantryItems(JSON.parse(savedPantry));
            }, []);

            useEffect(() => { localStorage.setItem('groceryItems', JSON.stringify(items)); }, [items]);
            useEffect(() => { localStorage.setItem('pantryItems', JSON.stringify(pantryItems)); }, [pantryItems]);

            const addItem = () => {
                if (!newItem.trim()) return;
                const item = { 
                    id: Date.now(), 
                    name: newItem.trim(), 
                    quantity: parseFloat(newQuantity) || 1, 
                    price: newPrice, 
                    aisle: getAisleForItem(newItem), 
                    store: selectedStore, 
                    checked: false 
                };
                setItems([item, ...items]);
                setNewItem(''); setNewQuantity(1); setNewPrice('');
            };

            const shareList = () => {
                const text = items
                    .filter(i => !i.checked)
                    .map(i => `• ${i.name} (${i.quantity})`)
                    .join('\n');
                const message = `🛒 *Mi Lista de Compras:*\n\n${text || 'La lista está vacía.'}`;
                
                if (navigator.share) {
                    navigator.share({ title: 'Mi Lista', text: message });
                } else {
                    navigator.clipboard.writeText(message);
                    alert('List copied to clipboard!');
                }
            };

            const toggleCheck = (id) => setItems(items.map(i => i.id === id ? { ...i, checked: !i.checked } : i));
            const deleteItem = (id) => setItems(items.filter(i => i.id !== id));
            
            const cartTotal = items.reduce((sum, i) => sum + (parseFloat(i.price || 0) * parseFloat(i.quantity || 1)), 0);
            const groupedByAisle = items.filter(i => !i.checked).reduce((acc, i) => { (acc[i.aisle] = acc[i.aisle] || []).push(i); return acc; }, {});

            return (
                <div className="min-h-screen pb-32">
                    <div className="max-w-xl mx-auto p-4">
                        
                        <header className="rounded-2xl shadow-lg px-4 pt-4 pb-4 mb-6 text-white bg-gradient-to-br from-emerald-600 to-teal-800 sticky top-2 z-50">
                            <div className="flex items-center justify-between mb-4">
                                <div className="flex items-center gap-2">
                                    <div className="p-2 bg-white/20 rounded-lg"><Icon name="ShoppingCart" className="w-5 h-5" /></div>
                                    <h1 className="text-lg font-black uppercase tracking-tighter">Mi Lista 🇵🇷</h1>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={shareList} className="p-2 hover:bg-white/10 rounded-full transition-colors"><Icon name="Share" className="w-5 h-5" /></button>
                                    <button onClick={() => setShowMenu(!showMenu)} className="p-2 hover:bg-white/10 rounded-full transition-colors"><Icon name="Menu" className="w-5 h-5" /></button>
                                </div>
                            </div>
                            <div className="relative">
                                <Icon name="Search" className="absolute left-3 top-1/2 -translate-y-1/2 text-white/60 w-4 h-4" />
                                <input
                                    type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="Search items or pantry..."
                                    className="w-full pl-10 pr-4 py-2.5 bg-white/10 border border-white/20 rounded-xl text-sm placeholder-white/60 focus:outline-none focus:bg-white/20 transition-all"
                                />
                            </div>
                        </header>

                        {showMenu && (
                            <div className="mb-4 bg-white rounded-xl shadow-xl border border-slate-100 overflow-hidden scale-in">
                                <button onClick={() => {setShowPantry(!showPantry); setShowMenu(false)}} className="w-full flex items-center gap-3 px-5 py-4 hover:bg-slate-50 border-b text-slate-700 font-bold text-sm">
                                    <Icon name="Package" className="w-5 h-5 text-emerald-500" /> {showPantry ? 'Hide' : 'Show'} Pantry Database
                                </button>
                                <button onClick={() => {setItems(items.filter(i => !i.checked)); setShowMenu(false)}} className="w-full flex items-center gap-3 px-5 py-4 hover:bg-slate-50 border-b text-slate-700 font-bold text-sm">
                                    <Icon name="Check" className="w-5 h-5 text-emerald-500" /> Clear Checked Items
                                </button>
                                <button onClick={() => {if(confirm('Reset list?')) setItems([]); setShowMenu(false)}} className="w-full flex items-center gap-3 px-5 py-4 hover:bg-red-50 text-red-600 font-bold text-sm">
                                    <Icon name="Trash2" className="w-5 h-5" /> Reset All Data
                                </button>
                            </div>
                        )}

                        {/* Quick Input */}
                        <div className="bg-white rounded-2xl shadow-sm p-4 mb-6 border border-slate-200">
                            <div className="flex gap-2 mb-3">
                                <input type="text" placeholder="What do you need?" value={newItem} onChange={e => setNewItem(e.target.value)} onKeyPress={e => e.key === 'Enter' && addItem()} className="flex-1 p-3 bg-slate-50 border border-slate-100 rounded-xl text-sm font-medium focus:ring-2 focus:ring-emerald-500 outline-none transition-all"/>
                            </div>
                            <div className="flex items-center justify-between gap-3">
                                <div className="flex items-center bg-slate-100 rounded-xl px-2">
                                    <button onClick={() => setNewQuantity(Math.max(1, newQuantity - 1))} className="p-2 text-slate-500"><Icon name="Minus" className="w-4 h-4"/></button>
                                    <span className="w-8 text-center font-bold text-sm">{newQuantity}</span>
                                    <button onClick={() => setNewQuantity(newQuantity + 1)} className="p-2 text-slate-500"><Icon name="Plus" className="w-4 h-4"/></button>
                                </div>
                                <div className="relative flex-1">
                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-xs">$</span>
                                    <input type="number" placeholder="Price" value={newPrice} onChange={e => setNewPrice(e.target.value)} className="w-full pl-7 pr-3 py-2 bg-slate-50 border border-slate-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500"/>
                                </div>
                                <button onClick={addItem} className="bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl px-6 py-2.5 transition-all text-sm shadow-md shadow-emerald-100 uppercase tracking-tight">Add</button>
                            </div>
                        </div>

                        {/* List Empty State */}
                        {items.length === 0 && (
                            <div className="text-center py-20 opacity-20">
                                <Icon name="ShoppingCart" className="w-16 h-16 mx-auto mb-4" />
                                <p className="font-black text-xl uppercase tracking-tighter">Your list is empty</p>
                            </div>
                        )}

                        {/* List Rendering */}
                        <div className="space-y-6">
                            {Object.entries(groupedByAisle).sort().map(([aisle, aisleItems]) => (
                                <div key={aisle} className="animate-in fade-in slide-in-from-bottom-2 duration-300">
                                    <h3 className="px-1 mb-2 text-[10px] font-black uppercase text-slate-400 tracking-[0.2em]">{aisle}</h3>
                                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 divide-y divide-slate-50 overflow-hidden">
                                        {aisleItems.map(item => (
                                            <div key={item.id} className="p-4 flex gap-4 items-center group">
                                                <button 
                                                    onClick={() => toggleCheck(item.id)} 
                                                    className={`w-6 h-6 rounded-lg border-2 shrink-0 transition-all duration-300 flex items-center justify-center ${item.checked ? 'bg-emerald-500 border-emerald-500' : 'border-slate-200'}`}
                                                >
                                                    {item.checked && <Icon name="Check" className="w-4 h-4 text-white" />}
                                                </button>
                                                
                                                <div className="flex-1 min-w-0" onClick={() => setEditingItem(item)}>
                                                    <p className="font-semibold text-slate-700 text-sm truncate">{item.name}</p>
                                                    <div className="flex items-center gap-2 mt-0.5">
                                                        <span className="text-[10px] font-bold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">Qty: {item.quantity}</span>
                                                        {item.price && <span className="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded">${(parseFloat(item.price) * item.quantity).toFixed(2)}</span>}
                                                    </div>
                                                </div>
                                                
                                                <button onClick={() => deleteItem(item.id)} className="p-2 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="Trash2" className="w-4 h-4"/></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Purchased Section */}
                        {items.some(i => i.checked) && (
                            <div className="mt-10 pt-6 border-t border-slate-200">
                                <h3 className="text-[10px] font-black mb-4 uppercase text-slate-400 tracking-widest px-1">Completed</h3>
                                <div className="bg-white/50 rounded-2xl border border-dashed border-slate-200 divide-y divide-slate-100 overflow-hidden">
                                    {items.filter(i => i.checked).map(item => (
                                        <div key={item.id} className="flex items-center gap-3 p-3 text-slate-400">
                                            <button onClick={() => toggleCheck(item.id)} className="w-5 h-5 rounded-md bg-slate-200 flex items-center justify-center text-white shrink-0"><Icon name="Check" className="w-3.5 h-3.5"/></button>
                                            <span className="line-through text-xs font-medium truncate flex-1">{item.name}</span>
                                            <button onClick={() => deleteItem(item.id)} className="p-1 text-slate-300 hover:text-red-400"><Icon name="X" className="w-4 h-4"/></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Footer Progress & Total */}
                    {items.length > 0 && (
                        <div className="fixed bottom-0 inset-x-0 bg-white/80 backdrop-blur-xl border-t border-slate-200 pb-8 pt-4 px-6 z-40 shadow-[0_-10px_25px_-5px_rgba(0,0,0,0.05)]">
                            <div className="max-w-xl mx-auto flex justify-between items-end">
                                <div>
                                    <div className="flex items-center gap-2 mb-2">
                                        <div className="h-1.5 w-32 bg-slate-100 rounded-full overflow-hidden">
                                            <div className="h-full bg-emerald-500 transition-all duration-500" style={{width: `${(items.filter(i => i.checked).length / items.length) * 100}%`}}></div>
                                        </div>
                                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-tighter">
                                            {items.filter(i => i.checked).length}/{items.length}
                                        </span>
                                    </div>
                                    <p className="text-2xl font-black text-slate-800 tracking-tighter">${cartTotal.toFixed(2)}</p>
                                    <p className="text-[9px] font-bold text-emerald-600 uppercase tracking-widest">Estimated Total</p>
                                </div>
                                <button onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})} className="bg-slate-900 text-white p-3 rounded-full shadow-lg">
                                    <Icon name="Plus" className="w-5 h-5 rotate-45" />
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Edit Modal */}
                    {editingItem && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="bg-white rounded-t-3xl sm:rounded-2xl p-6 w-full max-w-sm shadow-2xl scale-in">
                                <div className="w-12 h-1.5 bg-slate-100 rounded-full mx-auto mb-6 sm:hidden"></div>
                                <h2 className="text-lg font-black text-slate-800 mb-6 uppercase tracking-tight">Edit Item</h2>
                                <div className="space-y-5">
                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase mb-1 block">Item Name</label>
                                        <input type="text" value={editingItem.name} onChange={e => setEditingItem({...editingItem, name: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-xl font-bold outline-none focus:ring-2 focus:ring-emerald-500" />
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] font-black text-slate-400 uppercase mb-1 block">Quantity</label>
                                            <div className="flex items-center justify-between bg-slate-50 rounded-xl p-1 border">
                                                <button onClick={() => setEditingItem({...editingItem, quantity: Math.max(1, editingItem.quantity - 1)})} className="p-3 text-slate-400"><Icon name="Minus" className="w-4 h-4"/></button>
                                                <span className="font-black">{editingItem.quantity}</span>
                                                <button onClick={() => setEditingItem({...editingItem, quantity: editingItem.quantity + 1})} className="p-3 text-slate-400"><Icon name="Plus" className="w-4 h-4"/></button>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-black text-slate-400 uppercase mb-1 block">Price ($)</label>
                                            <input type="number" value={editingItem.price} onChange={e => setEditingItem({...editingItem, price: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-xl font-bold outline-none" placeholder="0.00" />
                                        </div>
                                    </div>

                                    <div className="flex gap-3 pt-4">
                                        <button 
                                            onClick={() => {
                                                setItems(items.map(i => i.id === editingItem.id ? {...editingItem, aisle: getAisleForItem(editingItem.name)} : i));
                                                setEditingItem(null);
                                            }} 
                                            className="flex-1 bg-emerald-600 text-white font-black py-4 rounded-xl shadow-lg shadow-emerald-100 uppercase text-sm tracking-tight"
                                        >
                                            Save Changes
                                        </button>
                                        <button onClick={() => setEditingItem(null)} className="flex-1 bg-slate-100 text-slate-500 py-4 rounded-xl font-black uppercase text-sm tracking-tight">Cancel</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GroceryListApp />);
    </script>
</body>
</html>
