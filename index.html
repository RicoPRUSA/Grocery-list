<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista | Smart Grocery App</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- SheetJS (XLSX) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- INTERNAL ICON SYSTEM (Removes Lucide CDN Errors) ---
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Plus: <path d="M12 5v14M5 12h14" />,
                Trash2: <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6" />,
                Check: <path d="M20 6 9 17l-5-5" />,
                X: <path d="M18 6 6 18M6 6l12 12" />,
                ShoppingCart: <circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>,
                Edit2: <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />,
                Menu: <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>,
                Search: <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>,
                Upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>,
                Package: <path d="M16.5 9.4 7.5 4.21M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16zM3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"/>,
                DollarSign: <line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            };

            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                >
                    {icons[name] || null}
                </svg>
            );
        };

        const GroceryListApp = () => {
            const [items, setItems] = useState([]);
            const [pantryItems, setPantryItems] = useState([]);
            const [newItem, setNewItem] = useState('');
            const [newQuantity, setNewQuantity] = useState('1');
            const [newPrice, setNewPrice] = useState('');
            const [selectedStore, setSelectedStore] = useState('Walmart');
            const [editingId, setEditingId] = useState(null);
            const [editText, setEditText] = useState('');
            const [editQuantity, setEditQuantity] = useState('');
            const [editPrice, setEditPrice] = useState('');
            const [editStore, setEditStore] = useState('');
            const [showMenu, setShowMenu] = useState(false);
            const [showPantry, setShowPantry] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');

            const stores = ['Walmart', "Sam's Club", 'Coquito', 'Talin Market'];

            const aisleMap = {
                'Dairy': ['milk', 'eggs', 'cheese', 'butter', 'yogurt', 'cream', 'half'],
                'Produce': ['apple', 'banana', 'orange', 'lettuce', 'tomato', 'onion', 'potato', 'carrot', 'cilantro', 'lime', 'lemon', 'garlic'],
                'Meat': ['chicken', 'beef', 'pork', 'turkey', 'fish', 'steak', 'bacon', 'ham'],
                'Bakery': ['bread', 'bagel', 'muffin', 'cake', 'tortilla'],
                'Frozen': ['ice cream', 'frozen', 'pizza', 'fries'],
                'Pantry': ['rice', 'pasta', 'cereal', 'flour', 'sugar', 'oil', 'salt'],
                'Beverages': ['water', 'juice', 'soda', 'coffee', 'beer', 'wine'],
                'Snacks': ['chips', 'crackers', 'cookies', 'candy', 'popcorn'],
                'Canned': ['soup', 'beans', 'corn', 'tuna', 'sauce'],
                'Pharmacy': ['shampoo', 'soap', 'medicine', 'vitamin', 'toothpaste']
            };

            const getAisleForItem = (itemName) => {
                const lowerName = itemName.toLowerCase();
                for (const [aisle, keywords] of Object.entries(aisleMap)) {
                    if (keywords.some(keyword => lowerName.includes(keyword))) return aisle;
                }
                return 'Other';
            };

            useEffect(() => {
                const savedItems = localStorage.getItem('groceryItems');
                const savedPantry = localStorage.getItem('pantryItems');
                if (savedItems) setItems(JSON.parse(savedItems));
                if (savedPantry) setPantryItems(JSON.parse(savedPantry));
            }, []);

            useEffect(() => {
                localStorage.setItem('groceryItems', JSON.stringify(items));
            }, [items]);

            useEffect(() => {
                localStorage.setItem('pantryItems', JSON.stringify(pantryItems));
            }, [pantryItems]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                        const newItems = jsonData.map((row, index) => ({
                            id: Date.now() + index,
                            name: String(row.Item || row.item || row.Name || row.name || '').trim(),
                            price: String(row.Price || row.price || '').trim()
                        })).filter(item => item.name);
                        setPantryItems(prev => [...prev, ...newItems]);
                        alert(`Imported ${newItems.length} items!`);
                    } catch (err) { alert("Error reading file."); }
                };
                reader.readAsArrayBuffer(file);
            };

            const addItem = () => {
                if (!newItem.trim()) return;
                const item = {
                    id: Date.now(),
                    name: newItem.trim(),
                    quantity: newQuantity || '1',
                    price: newPrice,
                    aisle: getAisleForItem(newItem),
                    store: selectedStore,
                    checked: false
                };
                setItems([item, ...items]);
                setNewItem('');
                setNewQuantity('1');
                setNewPrice('');
            };

            const addItemFromPantry = (pantryItem) => {
                const item = {
                    id: Date.now(),
                    name: pantryItem.name,
                    quantity: '1',
                    price: pantryItem.price || '',
                    aisle: getAisleForItem(pantryItem.name),
                    store: selectedStore,
                    checked: false
                };
                setItems([item, ...items]);
                setSearchQuery('');
            };

            const toggleCheck = (id) => setItems(items.map(i => i.id === id ? { ...i, checked: !i.checked } : i));
            const deleteItem = (id) => setItems(items.filter(i => i.id !== id));
            
            const saveEdit = () => {
                setItems(items.map(item =>
                    item.id === editingId
                        ? { ...item, name: editText, quantity: editQuantity, price: editPrice, store: editStore, aisle: getAisleForItem(editText) }
                        : item
                ));
                setEditingId(null);
            };

            const cartTotal = items.reduce((sum, item) => {
                const p = parseFloat(item.price) || 0;
                const q = parseFloat(item.quantity) || 1;
                return sum + (p * q);
            }, 0);

            const filteredPantry = searchQuery.length >= 2 
                ? pantryItems.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()))
                : [];

            const groupedByAisle = items
                .filter(i => !i.checked)
                .reduce((acc, item) => {
                    const aisle = item.aisle || 'Other';
                    if (!acc[aisle]) acc[aisle] = [];
                    acc[aisle].push(item);
                    return acc;
                }, {});

            return (
                <div className="min-h-screen pb-40">
                    <div className="max-w-2xl mx-auto p-4">
                        
                        {/* Header Section */}
                        <header className="rounded-2xl shadow-lg p-5 mb-4 text-white bg-gradient-to-br from-indigo-600 to-purple-700">
                            <div className="flex items-center justify-between mb-4">
                                <div className="flex items-center gap-3">
                                    <Icon name="ShoppingCart" className="w-7 h-7" />
                                    <h1 className="text-2xl font-black tracking-tight">MI LISTA</h1>
                                </div>
                                <button onClick={() => setShowMenu(!showMenu)} className="p-2 hover:bg-white/10 rounded-full transition-colors">
                                    <Icon name="Menu" className="w-6 h-6" />
                                </button>
                            </div>
                            <div className="relative">
                                <div className="absolute left-3 top-1/2 -translate-y-1/2 text-white/60">
                                    <Icon name="Search" className="w-4 h-4" />
                                </div>
                                <input
                                    type="text"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="Search your pantry database..."
                                    className="w-full pl-10 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-sm placeholder-white/60 focus:outline-none focus:bg-white/20 transition-all"
                                />
                                {filteredPantry.length > 0 && (
                                    <div className="absolute top-full left-0 right-0 mt-2 bg-white rounded-xl shadow-2xl border z-50 max-h-60 overflow-y-auto">
                                        {filteredPantry.map(p => (
                                            <button key={p.id} onClick={() => addItemFromPantry(p)} className="w-full flex justify-between p-4 hover:bg-indigo-50 border-b text-gray-800 text-left transition-colors">
                                                <span className="font-bold">{p.name}</span>
                                                <Icon name="Plus" className="w-5 h-5 text-indigo-600" />
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </header>

                        {/* Menu Actions */}
                        {showMenu && (
                            <div className="mb-4 bg-white rounded-xl shadow-xl border overflow-hidden scale-in">
                                <button onClick={() => {setShowPantry(!showPantry); setShowMenu(false)}} className="w-full flex items-center gap-3 px-5 py-4 hover:bg-gray-50 border-b text-gray-700 font-medium">
                                    <Icon name="Package" className="w-5 h-5 text-indigo-500" /> {showPantry ? 'Hide' : 'Show'} Pantry Manager
                                </button>
                                <button onClick={() => {setItems(items.filter(i => !i.checked)); setShowMenu(false)}} className="w-full flex items-center gap-3 px-5 py-4 hover:bg-gray-50 border-b text-gray-700 font-medium">
                                    <Icon name="Check" className="w-5 h-5 text-green-500" /> Clear Checked Items
                                </button>
                                <button onClick={() => {if(confirm('Delete entire list?')) setItems([]); setShowMenu(false)}} className="w-full flex items-center gap-3 px-5 py-4 hover:bg-red-50 text-red-600 font-medium">
                                    <Icon name="Trash2" className="w-5 h-5" /> Reset Everything
                                </button>
                            </div>
                        )}

                        {/* Pantry Management */}
                        {showPantry && (
                            <div className="bg-white rounded-xl shadow-md p-4 mb-4 border-2 border-indigo-100 scale-in">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="font-bold text-slate-800 flex items-center gap-2">
                                        <Icon name="Package" className="w-5 h-5 text-indigo-500" /> Pantry Manager
                                    </h2>
                                    <label className="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer flex items-center gap-2">
                                        <Icon name="Upload" className="w-3 h-3" /> Import
                                        <input type="file" className="hidden" onChange={handleFileUpload} />
                                    </label>
                                </div>
                                <div className="max-h-40 overflow-y-auto space-y-2 custom-scrollbar pr-1">
                                    {pantryItems.length === 0 && <p className="text-xs text-slate-400 text-center py-4 italic">Pantry is empty. Import an Excel file.</p>}
                                    {pantryItems.map(p => (
                                        <div key={p.id} className="flex justify-between items-center p-2 bg-slate-50 rounded">
                                            <span className="text-sm font-medium text-slate-700">{p.name}</span>
                                            <div className="flex gap-1">
                                                <button onClick={() => addItemFromPantry(p)} className="p-1 hover:bg-indigo-100 rounded text-indigo-600"><Icon name="Plus" className="w-4 h-4"/></button>
                                                <button onClick={() => setPantryItems(pantryItems.filter(i => i.id !== p.id))} className="p-1 hover:bg-red-100 rounded text-red-400"><Icon name="X" className="w-4 h-4"/></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Add Item Form */}
                        <div className="bg-white rounded-xl shadow-md p-3 mb-6 grid grid-cols-12 gap-2 border border-slate-200">
                            <input type="text" placeholder="Item name..." value={newItem} onChange={e => setNewItem(e.target.value)} onKeyPress={e => e.key === 'Enter' && addItem()} className="col-span-12 sm:col-span-5 p-2 bg-slate-50 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                            <input type="number" placeholder="Qty" value={newQuantity} onChange={e => setNewQuantity(e.target.value)} className="col-span-4 sm:col-span-2 p-2 bg-slate-50 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                            <input type="number" placeholder="$ Price" value={newPrice} onChange={e => setNewPrice(e.target.value)} className="col-span-8 sm:col-span-2 p-2 bg-slate-50 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
                            <button onClick={addItem} className="col-span-12 sm:col-span-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg py-2 transition-all flex items-center justify-center gap-1">
                                <Icon name="Plus" className="w-4 h-4" /> Add
                            </button>
                        </div>

                        {/* Active Grocery List */}
                        <div className="space-y-4">
                            {Object.keys(groupedByAisle).length === 0 && items.filter(i => !i.checked).length === 0 && (
                                <div className="text-center py-10 opacity-30">
                                    <Icon name="ShoppingCart" className="w-16 h-16 mx-auto mb-2" />
                                    <p className="font-bold">List is empty</p>
                                </div>
                            )}
                            
                            {Object.entries(groupedByAisle).sort().map(([aisle, aisleItems]) => (
                                <div key={aisle} className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="px-4 py-1.5 bg-slate-100 text-[10px] font-black uppercase text-slate-500 tracking-widest">{aisle}</div>
                                    <div className="divide-y divide-slate-50">
                                        {aisleItems.map(item => (
                                            <div key={item.id} className="flex items-center gap-3 p-4 hover:bg-slate-50 transition-colors">
                                                <button onClick={() => toggleCheck(item.id)} className="w-6 h-6 rounded-full border-2 border-indigo-400 shrink-0 hover:bg-indigo-50 transition-colors" />
                                                <div className="flex-1 min-w-0">
                                                    <p className="font-bold text-slate-800 truncate">{item.name}</p>
                                                    <p className="text-[10px] text-slate-400 font-bold uppercase">{item.quantity} Unit(s) • {item.store}</p>
                                                </div>
                                                <div className="text-right mr-2 shrink-0">
                                                    <p className="text-sm font-black text-emerald-600">${(parseFloat(item.price || 0) * parseFloat(item.quantity)).toFixed(2)}</p>
                                                </div>
                                                <div className="flex gap-1 shrink-0">
                                                    <button onClick={() => {setEditingId(item.id); setEditText(item.name); setEditQuantity(item.quantity); setEditPrice(item.price); setEditStore(item.store)}} className="p-2 text-slate-300 hover:text-indigo-600 transition-colors"><Icon name="Edit2" className="w-4 h-4"/></button>
                                                    <button onClick={() => deleteItem(item.id)} className="p-2 text-slate-300 hover:text-red-500 transition-colors"><Icon name="Trash2" className="w-4 h-4"/></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Purchased Section */}
                        {items.some(i => i.checked) && (
                            <div className="mt-8 opacity-60">
                                <h3 className="text-xs font-bold mb-3 uppercase text-slate-400 tracking-widest px-1">Purchased</h3>
                                <div className="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden">
                                    {items.filter(i => i.checked).map(item => (
                                        <div key={item.id} className="flex items-center gap-3 p-3 bg-slate-50/50">
                                            <button onClick={() => toggleCheck(item.id)} className="w-6 h-6 rounded-full bg-emerald-500 flex items-center justify-center text-white shrink-0 shadow-sm"><Icon name="Check" className="w-4 h-4"/></button>
                                            <span className="line-through text-sm font-medium text-slate-500 truncate flex-1">{item.name}</span>
                                            <button onClick={() => deleteItem(item.id)} className="p-2 text-slate-300 hover:text-red-500 shrink-0 transition-colors"><Icon name="Trash2" className="w-4 h-4"/></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Sticky Footer Total */}
                    {items.length > 0 && (
                        <div className="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-200 p-5 z-40 shadow-[0_-10px_30px_rgba(0,0,0,0.05)]">
                            <div className="max-w-2xl mx-auto flex justify-between items-center">
                                <div>
                                    <p className="text-[10px] font-black text-indigo-500 uppercase tracking-tighter">Est. Grand Total</p>
                                    <p className="text-4xl font-black text-slate-800 leading-none">${cartTotal.toFixed(2)}</p>
                                </div>
                                <div className="text-right">
                                    <div className="h-2 w-32 bg-slate-100 rounded-full mb-1.5 overflow-hidden border border-slate-50">
                                        <div 
                                            className="h-full bg-gradient-to-r from-indigo-500 to-purple-600 transition-all duration-700" 
                                            style={{width: `${(items.filter(i => i.checked).length / items.length) * 100}%`}}
                                        ></div>
                                    </div>
                                    <p className="text-xs font-black text-slate-400 uppercase tracking-wide">
                                        {items.filter(i => i.checked).length} / {items.length} Items Done
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Edit Modal Overlay */}
                    {editingId && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl scale-in border border-white">
                                <h2 className="text-xl font-black text-slate-800 mb-5 flex items-center gap-2">
                                    <Icon name="Edit2" className="w-5 h-5 text-indigo-500" /> Edit Item
                                </h2>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase px-1">Item Name</label>
                                        <input type="text" value={editText} onChange={e => setEditText(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase px-1">Quantity</label>
                                            <input type="number" value={editQuantity} onChange={e => setEditQuantity(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Qty" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase px-1">Price ($)</label>
                                            <input type="number" value={editPrice} onChange={e => setEditPrice(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Price" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-400 uppercase px-1">Store Selection</label>
                                        <select value={editStore} onChange={e => setEditStore(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none">
                                            {stores.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button onClick={saveEdit} className="flex-2 grow bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-xl transition-all shadow-lg shadow-indigo-100">Save Changes</button>
                                        <button onClick={() => setEditingId(null)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-500 py-4 rounded-xl font-bold transition-all">Cancel</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GroceryListApp />);
    </script>
</body>
</html>
