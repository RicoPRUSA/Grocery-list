<body class="text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCfuw-UnRXxGuaRhOsqfIalkzuy7rgU6Ao",
            authDomain: "mi-lista-bc5a2.firebaseapp.com",
            projectId: "mi-lista-bc5a2",
            databaseURL: "https://mi-lista-bc5a2-default-rtdb.firebaseio.com",
            storageBucket: "mi-lista-bc5a2.firebasestorage.app",
            messagingSenderId: "145809393270",
            appId: "1:145809393270:web:2c6053e877e6e9f0c54157"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const { useState, useEffect, useRef, useMemo } = React;

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Plus: <path d="M12 5v14M5 12h14" />,
                Minus: <path d="M5 12h14" />,
                Trash2: (<><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></>),
                Check: <path d="M20 6 9 17l-5-5" />,
                X: (<><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>),
                ShoppingCart: (<><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></>),
                Menu: (<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>),
                Search: (<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>),
                Mic: (<><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></>),
                Square: <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />,
                Upload: (<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></>),
                Download: (<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>),
                Package: (<><path d="m16.5 9.4-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.27 6.96 8.73 5.05 8.73-5.05M12 22.08V12"/></>),
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const GroceryListApp = () => {
            const stores = [
                { id: 'Walmart', icon: 'ShoppingCart', color: 'text-blue-500', label: 'Walmart' },
                { id: "Sam's Club", icon: 'Package', color: 'text-orange-700', label: "Sam's" },
                { id: 'Coquito', icon: '🥥', isEmoji: true, label: 'Coquito' },
                { id: 'Talin Market', icon: '🇵🇷', isEmoji: true, label: 'Talin' }
            ];
            
            const [items, setItems] = useState([]);
            const [pantryItems, setPantryItems] = useState([]);
            const [syncCode, setSyncCode] = useState(localStorage.getItem('syncCode') || 'Familia');
            const [currentStore, setCurrentStore] = useState('Walmart');
            const [editingItem, setEditingItem] = useState(null);
            const [showMenu, setShowMenu] = useState(false);
            const [showPantry, setShowPantry] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [isListening, setIsListening] = useState(false);
            
            const searchRef = useRef(null);
            const recognitionRef = useRef(null);

            const aisleMap = {
                '🥦 Produce': ['apple', 'banana', 'orange', 'lettuce', 'tomato', 'onion', 'potato', 'carrot', 'cilantro', 'lime', 'lemon', 'garlic', 'pepper', 'fruit', 'veggie', 'recao', 'aguacate', 'plátano', 'guineo'],
                '🥩 Meat': ['chicken', 'beef', 'pork', 'turkey', 'fish', 'steak', 'bacon', 'ham', 'chorizo', 'sausage', 'pollo', 'carne'],
                '🥛 Dairy': ['milk', 'egg', 'cheese', 'butter', 'yogurt', 'cream', 'half', 'leche', 'huevo', 'queso'],
                '🍞 Bakery': ['bread', 'bagel', 'muffin', 'cake', 'pan', 'bizcocho'],
                '🥫 Canned': ['soup', 'beans', 'corn', 'tuna', 'sauce', 'habichuela', 'gandules'],
                '🍝 Pantry': ['rice', 'pasta', 'cereal', 'flour', 'sugar', 'oil', 'salt', 'pepper', 'spices', 'arroz', 'aceite', 'azúcar'],
                '🥤 Beverages': ['water', 'juice', 'soda', 'coffee', 'beer', 'wine', 'malta', 'agua', 'jugo', 'refresco', 'café'],
                '❄️ Frozen': ['ice cream', 'frozen', 'pizza', 'fries', 'nugget', 'helado'],
                '🥨 Snacks': ['chips', 'crackers', 'cookies', 'candy', 'popcorn', 'nuts'],
                '🧼 Pharmacy': ['shampoo', 'soap', 'medicine', 'toothpaste', 'jabón']
            };

            const getAisleForItem = (itemName) => {
                if (!itemName) return '📦 Other';
                const lowerName = itemName.toLowerCase();
                for (const [aisle, keywords] of Object.entries(aisleMap)) {
                    if (keywords.some(keyword => lowerName.includes(keyword))) return aisle;
                }
                return '📦 Other';
            };

            // Firebase Sync
            useEffect(() => {
                const listRef = db.ref(`lists/${syncCode}/items`);
                listRef.on('value', (snap) => {
                    const data = snap.val();
                    setItems(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
                });
                const pantryRef = db.ref(`lists/${syncCode}/pantry`);
                pantryRef.on('value', (snap) => {
                    const data = snap.val();
                    setPantryItems(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
                });
                return () => { listRef.off(); pantryRef.off(); };
            }, [syncCode]);

            const addItemManually = (name, price = "") => {
                if (!name.trim()) return;
                const match = pantryItems.find(p => p.name.toLowerCase() === name.trim().toLowerCase());
                const finalPrice = price || (match ? match.price : '');
                const aisle = match ? match.aisle : getAisleForItem(name);
                
                db.ref(`lists/${syncCode}/items`).push({ name: name.trim(), quantity: 1, price: finalPrice, aisle, store: currentStore, checked: false });
                
                if (!match) {
                    db.ref(`lists/${syncCode}/pantry`).push({ name: name.trim(), price: finalPrice, aisle });
                }
                setSearchQuery('');
            };

            const addItemFromPantry = (p) => {
                db.ref(`lists/${syncCode}/items`).push({ name: p.name, quantity: 1, price: p.price || '', aisle: p.aisle, store: currentStore, checked: false });
                setSearchQuery('');
            };

            const toggleCheck = (id, currentStatus) => db.ref(`lists/${syncCode}/items/${id}`).update({ checked: !currentStatus });
            const deleteItem = (id) => db.ref(`lists/${syncCode}/items/${id}`).remove();

            const saveModalChanges = () => {
                if (!editingItem) return;
                const updatedAisle = getAisleForItem(editingItem.name);
                db.ref(`lists/${syncCode}/items/${editingItem.id}`).update({ ...editingItem, aisle: updatedAisle });
                
                const existingPantry = pantryItems.find(p => p.name.toLowerCase() === editingItem.name.toLowerCase());
                if (existingPantry) {
                    db.ref(`lists/${syncCode}/pantry/${existingPantry.id}`).update({ price: editingItem.price, aisle: updatedAisle });
                } else {
                    db.ref(`lists/${syncCode}/pantry`).push({ name: editingItem.name, price: editingItem.price, aisle: updatedAisle });
                }
                setEditingItem(null);
            };

            const updatePantryPriceAndSyncList = (id, name, newPrice) => {
                db.ref(`lists/${syncCode}/pantry/${id}`).update({ price: newPrice });
                items.forEach(item => {
                    if (item.name.toLowerCase() === name.toLowerCase()) {
                        db.ref(`lists/${syncCode}/items/${item.id}`).update({ price: newPrice });
                    }
                });
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                        jsonData.forEach((row) => {
                            const nameKey = Object.keys(row).find(k => ['item', 'name', 'producto'].includes(k.toLowerCase()));
                            const priceKey = Object.keys(row).find(k => ['price', 'precio'].includes(k.toLowerCase()));
                            const aisleKey = Object.keys(row).find(k => ['aisle', 'pasillo'].includes(k.toLowerCase()));
                            const name = nameKey ? String(row[nameKey]).trim() : '';
                            if (name) {
                                db.ref(`lists/${syncCode}/pantry`).push({
                                    name,
                                    price: priceKey ? String(row[priceKey]).trim() : '',
                                    aisle: aisleKey ? String(row[aisleKey]).trim() : getAisleForItem(name)
                                });
                            }
                        });
                        alert("Pantry updated!");
                    } catch (err) { alert("Error reading file."); }
                };
                reader.readAsArrayBuffer(file);
            };

            const exportPantryToExcel = () => {
                if (pantryItems.length === 0) return alert("Pantry is empty!");
                const data = pantryItems.map(p => ({ Item: p.name, Price: p.price, Aisle: p.aisle }));
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Pantry Database");
                XLSX.writeFile(wb, "Mi_Pantry_Database.xlsx");
                setShowMenu(false);
            };

            const toggleVoiceSearch = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return alert("Mic not supported");
                if (isListening) { recognitionRef.current?.stop(); return; }
                const recognition = new SpeechRecognition();
                recognition.lang = 'es-PR';
                recognition.onstart = () => setIsListening(true);
                recognition.onend = () => setIsListening(false);
                recognition.onresult = (e) => setSearchQuery(e.results[0][0].transcript);
                recognitionRef.current = recognition;
                recognition.start();
            };

            const storeItems = useMemo(() => items.filter(i => i.store === currentStore), [items, currentStore]);
            const cartTotal = storeItems.reduce((sum, i) => sum + (parseFloat(i.price || 0) * parseFloat(i.quantity || 1)), 0);
            const aisleStats = useMemo(() => {
                const stats = {};
                storeItems.forEach(item => {
                    if (!stats[item.aisle]) stats[item.aisle] = { total: 0, checked: 0 };
                    stats[item.aisle].total++;
                    if (item.checked) stats[item.aisle].checked++;
                });
                return stats;
            }, [storeItems]);
            const groupedByAisle = storeItems.filter(i => !i.checked).reduce((acc, i) => { (acc[i.aisle] = acc[i.aisle] || []).push(i); return acc; }, {});
            const pantryResults = searchQuery.length > 0 ? pantryItems.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase())) : [];

            return (
                <div className="min-h-screen pb-32">
                    <div className="max-w-2xl mx-auto px-2 sm:px-4 py-4 text-slate-900">
                        
                        <header className="relative rounded-2xl profound-shadow px-4 sm:px-6 py-4 text-white bg-gradient-to-br from-emerald-600 to-teal-800 mb-3 z-50">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="bg-white/20 p-2 rounded-lg"><Icon name="ShoppingCart" className="w-5 h-5" /></div>
                                    <h1 className="text-lg font-black uppercase tracking-tight">Mi Lista 🇵🇷</h1>
                                </div>
                                <div className="flex items-center gap-1">
                                    <button onClick={() => setShowPantry(!showPantry)} className={`p-2 rounded-full transition-all active:scale-90 ${showPantry ? 'bg-white text-emerald-700 shadow-inner' : 'hover:bg-white/10 text-white/80'}`}><Icon name="Package" className="w-5 h-5" /></button>
                                    <button onClick={() => setShowMenu(!showMenu)} className="p-2 hover:bg-white/10 rounded-full transition-colors active:scale-90"><Icon name={showMenu ? "X" : "Menu"} className="w-6 h-6" /></button>
                                </div>
                            </div>
                            {showMenu && (
                                <div className="absolute top-full left-0 right-0 mt-2 bg-white rounded-xl profound-shadow border border-slate-100 overflow-hidden scale-in z-[60] text-slate-700 mx-1">
                                    <div className="p-4 bg-slate-50 border-b">
                                        <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Sync Code</label>
                                        <input type="text" value={syncCode} onChange={(e) => {setSyncCode(e.target.value); localStorage.setItem('syncCode', e.target.value);}} className="w-full p-2 bg-white border rounded text-sm font-bold outline-none focus:ring-2 focus:ring-emerald-500" />
                                    </div>
                                    <button onClick={exportPantryToExcel} className="w-full flex items-center gap-3 px-6 py-4 hover:bg-slate-50 border-b font-bold text-sm text-slate-600"><Icon name="Download" /> Export Pantry Database</button>
                                    <button onClick={() => { storeItems.filter(i => i.checked).forEach(i => db.ref(`lists/${syncCode}/items/${i.id}`).remove()); setShowMenu(false); }} className="w-full flex items-center gap-3 px-6 py-4 hover:bg-slate-50 border-b font-bold text-sm text-emerald-600"><Icon name="Check" /> Clear Purchased ({currentStore})</button>
                                    <button onClick={() => { if(confirm('Delete all for '+currentStore+'?')) { storeItems.forEach(i => db.ref(`lists/${syncCode}/items/${i.id}`).remove()); setShowMenu(false); }}} className="w-full flex items-center gap-3 px-6 py-4 hover:bg-red-50 border-b font-bold text-sm text-red-600"><Icon name="Trash2" /> Reset {currentStore} List</button>
                                    <button onClick={() => { if(confirm('Factory Reset Entire App?')) { db.ref(`lists/${syncCode}`).remove(); localStorage.clear(); location.reload(); }}} className="w-full flex items-center gap-3 px-6 py-4 hover:bg-red-100 font-bold text-sm text-red-700"><Icon name="X" /> Wipe All Data</button>
                                </div>
                            )}
                        </header>

                        <div className="flex gap-2 overflow-x-auto pb-4 px-1 no-scrollbar mb-4">
                            {stores.map(s => (
                                <button key={s.id} onClick={() => setCurrentStore(s.id)} className={`flex items-center gap-2 whitespace-nowrap px-4 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all ${currentStore === s.id ? 'bg-white text-slate-800 shadow-lg profound-shadow ring-2 ring-emerald-500/20' : 'bg-white/50 text-slate-400 opacity-70'}`}>
                                    {s.isEmoji ? <span className="text-sm">{s.icon}</span> : <Icon name={s.icon} className={`w-4 h-4 ${s.color}`} />}{s.label}
                                </button>
                            ))}
                        </div>

                        <div className="relative z-40 mb-8">
                            <Icon name="Search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4" />
                            <input ref={searchRef} type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && addItemManually(searchQuery)} placeholder={isListening ? "Listening..." : "Search or add items..."} className={`w-full pl-11 pr-14 py-4 bg-white border border-slate-100 rounded-xl profound-shadow text-sm placeholder-slate-400 focus:outline-none transition-all font-medium text-slate-900 ${isListening ? 'border-red-500 ring-4 ring-red-100' : 'focus:ring-2 focus:ring-emerald-500'}`} />
                            <button onClick={toggleVoiceSearch} className="absolute right-3 top-1/2 -translate-y-1/2 p-2.5 hover:bg-slate-50 rounded-full active:scale-90 z-50">
                                {isListening ? <Icon name="Square" className="w-5 h-5 text-red-600 pulse-red" /> : <Icon name="Mic" className="w-5 h-5 text-slate-400" />}
                            </button>
                            {searchQuery.length > 0 && (
                                <div className="absolute top-full left-0 right-0 mt-3 bg-white rounded-xl shadow-2xl border border-slate-100 z-50 max-h-[50vh] overflow-y-auto scale-in">
                                    <button onClick={() => addItemManually(searchQuery)} className="w-full flex items-center gap-4 p-4 hover:bg-emerald-50 border-b text-emerald-600 font-black text-sm text-left"><div className="p-1.5 bg-emerald-100 rounded-lg"><Icon name="Plus" className="w-4 h-4" /></div>Add "{searchQuery}"</button>
                                    {pantryResults.map(p => (<button key={p.id} onClick={() => addItemFromPantry(p)} className="w-full flex justify-between items-center p-4 hover:bg-slate-50 border-b last:border-0 text-left"><div><span className="font-bold text-sm block">{p.name}</span><span className="text-[10px] text-slate-500 uppercase font-black tracking-tighter">{p.aisle}</span></div><div className="p-1.5 bg-slate-100 text-slate-400 rounded-lg"><Icon name="Plus" className="w-4 h-4" /></div></button>))}
                                </div>
                            )}
                        </div>

                        {showPantry && (
                            <div className="bg-white rounded-2xl profound-shadow p-5 mb-8 border border-emerald-50 scale-in mx-1">
                                <div className="flex justify-between items-center mb-5 border-b border-slate-50 pb-3">
                                    <h2 className="font-black text-slate-700 text-[10px] uppercase tracking-[0.2em] flex items-center gap-2"><Icon name="Package" className="w-3 h-3 text-emerald-500" /> Pantry Database</h2>
                                    <label className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-[10px] font-black cursor-pointer shadow-md active:scale-95"><Icon name="Upload" className="w-3 h-3 inline mr-1" /> IMPORT<input type="file" className="hidden" onChange={handleFileUpload} /></label>
                                </div>
                                <div className="max-h-64 overflow-y-auto space-y-2 custom-scrollbar pr-2">
                                    {pantryItems.map(p => (
                                        <div key={p.id} className="flex justify-between items-center p-4 bg-slate-50 rounded-xl border border-slate-100">
                                            <div className="flex-1 mr-4"><p className="text-xs font-bold text-slate-700">{p.name}</p><p className="text-[9px] text-slate-500 font-black uppercase">{p.aisle}</p></div>
                                            <div className="flex items-center gap-3">
                                                <input type="number" step="0.01" value={p.price} onChange={(e) => updatePantryPriceAndSyncList(p.id, p.name, e.target.value)} className="w-16 p-2 text-[11px] font-black border rounded-lg bg-white outline-none focus:ring-2 focus:ring-emerald-400" />
                                                <button onClick={() => addItemFromPantry(p)} className="p-2 text-emerald-600 hover:bg-emerald-100 rounded-lg"><Icon name="Plus" className="w-4 h-4"/></button>
                                                <button onClick={() => db.ref(`lists/${syncCode}/pantry/${p.id}`).remove()} className="p-2 text-red-300"><Icon name="X" className="w-4 h-4"/></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="space-y-10">
                            {Object.entries(groupedByAisle).sort().map(([aisle, aisleItems]) => (
                                <div key={aisle} className="scale-in">
                                    <div className="flex justify-between items-end px-2 mb-3">
                                        <div className="space-y-1 flex-1">
                                            <h3 className="text-[10px] font-black uppercase text-slate-600 tracking-[0.3em]">{aisle}</h3>
                                            <div className="h-1 bg-slate-300/30 rounded-full w-24 overflow-hidden"><div className="h-full bg-emerald-500 transition-all duration-700" style={{ width: `${(aisleStats[aisle]?.checked / aisleStats[aisle]?.total) * 100}%` }} /></div>
                                        </div>
                                        <span className="text-[9px] font-bold text-slate-500 uppercase tracking-widest">{aisleStats[aisle]?.checked}/{aisleStats[aisle]?.total} Done</span>
                                    </div>
                                    <div className="bg-white rounded-2xl profound-shadow border border-slate-50 divide-y overflow-hidden">
                                        {aisleItems.map(item => (
                                            <div key={item.id} className="p-5 flex gap-5 items-center transition-colors hover:bg-slate-50" onClick={() => setEditingItem({...item})}>
                                                <button onClick={(e) => { e.stopPropagation(); toggleCheck(item.id, item.checked); }} className="w-7 h-7 rounded-lg border-2 border-slate-100 shrink-0 flex items-center justify-center bg-white">{item.checked && <Icon name="Check" className="w-4 h-4 text-emerald-500" />}</button>
                                                <div className="flex-1 min-w-0">
                                                    <p className="font-bold text-slate-700 text-sm truncate">{item.name}</p>
                                                    <div className="flex items-center gap-3 mt-1"><span className="text-[10px] font-black text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md uppercase">x{item.quantity}</span>{item.price && <span className="text-[10px] font-black text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md tracking-wider">${(parseFloat(item.price) * item.quantity).toFixed(2)}</span>}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {storeItems.some(i => i.checked) && (
                            <div className="mt-16 opacity-50 text-center"><h3 className="text-[10px] font-black mb-4 uppercase text-slate-600 tracking-[0.3em]">In {currentStore} Cart</h3><div className="bg-white/40 rounded-xl border border-dashed border-slate-300 divide-y overflow-hidden mx-1">
                                {storeItems.filter(i => i.checked).map(item => (
                                    <div key={item.id} className="flex items-center gap-4 p-4 hover:bg-white/50 transition-colors">
                                        <button onClick={() => toggleCheck(item.id, true)} className="w-6 h-6 rounded-md bg-emerald-500 flex items-center justify-center text-white shrink-0 active:scale-90"><Icon name="Check" className="w-4 h-4"/></button>
                                        <span className="line-through text-xs font-semibold text-slate-500 truncate flex-1 text-left">{item.name}</span>
                                        <button onClick={() => deleteItem(item.id)} className="p-2 text-slate-300"><Icon name="Trash2" className="w-4 h-4"/></button>
                                    </div>
                                ))}
                            </div></div>
                        )}
                    </div>

                    {storeItems.length > 0 && (
                        <div className="fixed bottom-0 inset-x-0 bg-white/80 backdrop-blur-xl border-t border-slate-200 py-4 px-8 z-40 shadow-2xl text-slate-900"><div className="max-w-2xl mx-auto flex justify-between items-center"><div><p className="text-[9px] font-black text-emerald-600 uppercase mb-1">{currentStore} Total</p><p className="text-base font-black text-slate-800 leading-none">${cartTotal.toFixed(2)}</p></div><div className="text-right"><div className="h-2 w-24 bg-slate-200 rounded-full mb-1.5 overflow-hidden"><div className="h-full bg-emerald-500 transition-all duration-1000" style={{width: `${(storeItems.filter(i => i.checked).length / storeItems.length) * 100}%`}}></div></div><p className="text-[9px] font-black text-slate-500 uppercase">{storeItems.filter(i => i.checked).length}/{storeItems.length} Done</p></div></div></div>
                    )}

                    {editingItem && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-md z-[100] flex items-center justify-center p-4 text-slate-900">
                            <div className="bg-white rounded-2xl p-8 w-full max-w-sm profound-shadow scale-in">
                                <h2 className="text-sm font-black text-slate-800 mb-6 uppercase border-b pb-2">Edit Details</h2>
                                <div className="space-y-6">
                                    <div><label className="text-[9px] font-black text-slate-500 uppercase block ml-1">Name</label><input type="text" value={editingItem.name} onChange={e => setEditingItem({...editingItem, name: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-emerald-500" /></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-[9px] font-black text-slate-500 uppercase block ml-1">Qty</label><div className="flex items-center bg-slate-50 rounded-xl border p-1"><button onClick={() => setEditingItem({...editingItem, quantity: Math.max(1, editingItem.quantity - 1)})} className="p-3 text-slate-400"><Icon name="Minus" className="w-4 h-4"/></button><span className="flex-1 text-center font-black text-sm">{editingItem.quantity}</span><button onClick={() => setEditingItem({...editingItem, quantity: editingItem.quantity + 1})} className="p-3 text-slate-400"><Icon name="Plus" className="w-4 h-4"/></button></div></div>
                                        <div><label className="text-[9px] font-black text-slate-500 uppercase block ml-1">Price ($)</label><input type="number" step="0.01" value={editingItem.price} onChange={e => setEditingItem({...editingItem, price: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-xl text-sm font-black" /></div>
                                    </div>
                                    <div><label className="text-[9px] font-black text-slate-500 uppercase block ml-1">Store</label><select value={editingItem.store} onChange={e => setEditingItem({...editingItem, store: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-xl text-sm font-bold appearance-none">{stores.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}</select></div>
                                    <button onClick={saveModalChanges} className="w-full bg-emerald-600 text-white font-black py-4 rounded-xl uppercase text-[10px] active:scale-95 transition-all shadow-none">Save Changes</button>
                                    <button onClick={() => setEditingItem(null)} className="w-full py-2 text-slate-400 text-[10px] font-black uppercase tracking-widest">Cancel</button>
                                    <button onClick={() => {deleteItem(editingItem.id); setEditingItem(null);}} className="w-full py-2 text-red-500 text-[10px] font-black uppercase tracking-widest opacity-60">Delete Item</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GroceryListApp />);
    </script>
</body>
</html>
