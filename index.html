<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grocery List</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Excel -->
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function GroceryListApp() {
  const [items, setItems] = useState([]);
  const [pantry, setPantry] = useState([]);
  const [newItem, setNewItem] = useState('');
  const [qty, setQty] = useState('1');
  const [price, setPrice] = useState('');
  const [showPantry, setShowPantry] = useState(false);
  const [search, setSearch] = useState('');

  useEffect(() => {
    setItems(JSON.parse(localStorage.getItem('groceryItems') || '[]'));
    setPantry(JSON.parse(localStorage.getItem('pantryItems') || '[]'));
  }, []);

  useEffect(() => {
    localStorage.setItem('groceryItems', JSON.stringify(items));
  }, [items]);

  useEffect(() => {
    localStorage.setItem('pantryItems', JSON.stringify(pantry));
  }, [pantry]);

  const addItem = () => {
    if (!newItem.trim()) return;
    const item = {
      id: Date.now(),
      name: newItem.trim(),
      quantity: qty,
      price: price,
      checked: false
    };
    setItems([item, ...items]);
    setNewItem('');
    setQty('1');
    setPrice('');
  };

  const toggleCheck = (id) => {
    setItems(items.map(i =>
      i.id === id ? { ...i, checked: !i.checked } : i
    ));
  };

  const cartTotal = items.reduce(
    (s, i) => s + (parseFloat(i.price) || 0) * (parseInt(i.quantity) || 1),
    0
  );

  const filteredPantry =
    search.length >= 3
      ? pantry.filter(p => p.name.toLowerCase().includes(search.toLowerCase()))
      : [];

  return (
    <div className="max-w-3xl mx-auto p-4 pb-24">

      {/* Header */}
      <div className="bg-[#27395F] text-white p-4 rounded-xl shadow flex justify-between">
        <h1 className="text-xl font-bold">🛒 Grocery List</h1>
        <button onClick={() => setShowPantry(!showPantry)} className="text-2xl">☰</button>
      </div>

      {/* Add Item */}
      <div className="bg-white rounded-xl shadow p-4 mt-4 space-y-2">
        <input
          value={newItem}
          onChange={e => setNewItem(e.target.value)}
          placeholder="Item"
          className="w-full border p-2 rounded"
        />
        <div className="flex gap-2">
          <input value={qty} onChange={e => setQty(e.target.value)} className="w-16 border p-2 rounded" />
          <input value={price} onChange={e => setPrice(e.target.value)} placeholder="Price" className="w-24 border p-2 rounded" />
          <button onClick={addItem} className="bg-green-500 text-white px-4 rounded">➕</button>
        </div>
      </div>

      {/* Pantry */}
      {showPantry && (
        <div className="bg-white rounded-xl shadow p-4 mt-4">
          <h2 className="font-bold mb-2">📦 Pantry</h2>
          <input
            value={search}
            onChange={e => setSearch(e.target.value)}
            placeholder="Search pantry"
            className="w-full border p-2 rounded mb-2"
          />
          {filteredPantry.map(p => (
            <div key={p.id} className="flex justify-between p-2 border-b">
              <span>{p.name}</span>
              <button onClick={() => setItems([{...p, id: Date.now(), checked:false}, ...items])}>➕</button>
            </div>
          ))}
        </div>
      )}

      {/* Items */}
      <div className="mt-4 space-y-2">
        {items.map(i => (
          <div key={i.id} className="bg-white rounded-xl shadow p-3 flex justify-between items-center">
            <div>
              <input type="checkbox" checked={i.checked} onChange={() => toggleCheck(i.id)} />
              <span className={i.checked ? 'line-through ml-2' : 'ml-2'}>{i.name}</span>
            </div>
            <span>${((i.price || 0) * i.quantity).toFixed(2)}</span>
          </div>
        ))}
      </div>

      {/* Cart */}
      <div className="fixed bottom-0 left-0 right-0 bg-[#27395F] text-white p-4">
        <div className="max-w-3xl mx-auto flex justify-between">
          <span>Total</span>
          <span className="font-bold">${cartTotal.toFixed(2)}</span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<GroceryListApp />);
</script>
</body>
</html>
