<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grocery List</title>

<style>
:root {
  --grad: linear-gradient(135deg, #7c8ce4, #8e63b6);
  --green: #0bb058;
  --purple: #a855f7;
  --bg: #f4f6fb;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  padding-bottom: 90px;
}

.container {
  max-width: 480px;
  margin: auto;
  padding: 12px;
}

/* HEADER */
.header {
  background: var(--grad);
  color: white;
  padding: 16px;
  border-radius: 16px;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header h1 {
  font-size: 20px;
  margin: 0;
  display: flex;
  gap: 8px;
  align-items: center;
}

.menu {
  font-size: 22px;
  cursor: pointer;
}

.search {
  margin-top: 12px;
  background: white;
  border-radius: 999px;
  padding: 10px 14px;
  display: flex;
  gap: 8px;
  align-items: center;
}

.search input {
  border: none;
  outline: none;
  width: 100%;
  font-size: 15px;
}

/* CARD */
.card {
  background: white;
  border-radius: 16px;
  padding: 14px;
  margin-top: 14px;
  box-shadow: 0 6px 18px rgba(0,0,0,.06);
}

.card input, .card select {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
  font-size: 14px;
}

.row {
  display: flex;
  gap: 10px;
}

.add-btn {
  margin-top: 10px;
  background: var(--purple);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 12px;
  font-size: 16px;
  width: 100%;
  cursor: pointer;
}

/* SECTION HEADERS */
.section-header {
  margin-top: 18px;
  background: var(--grad);
  color: white;
  padding: 10px 14px;
  border-radius: 14px 14px 0 0;
  font-weight: 600;
}

/* ITEM */
.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  border-bottom: 1px solid #eee;
}

.item:last-child { border-bottom: none; }

.left {
  display: flex;
  gap: 10px;
  align-items: center;
}

.checkbox {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid var(--purple);
  display: grid;
  place-items: center;
  cursor: pointer;
}

.checkbox.checked {
  background: var(--green);
  border-color: var(--green);
  color: white;
}

.name {
  font-weight: 500;
}

.sub {
  font-size: 12px;
  color: #666;
}

.price {
  color: var(--green);
  font-weight: 600;
  margin-left: 6px;
}

.actions {
  display: flex;
  gap: 10px;
  font-size: 18px;
  cursor: pointer;
}

/* PURCHASED */
.purchased-header {
  background: var(--green);
  color: white;
  margin-top: 18px;
  padding: 10px 14px;
  border-radius: 14px 14px 0 0;
  font-weight: 600;
}

.purchased .name {
  text-decoration: line-through;
  color: #999;
}

/* FOOTER */
.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--grad);
  color: white;
  padding: 14px;
}

.footer-inner {
  max-width: 480px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  font-size: 18px;
  font-weight: 600;
}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <h1>🛒 Grocery List 🇵🇷</h1>
      <div class="menu">☰</div>
    </div>
    <div class="search">
      🔍
      <input placeholder="Search pantry (3+ letters)..." />
    </div>
  </div>

  <!-- ADD ITEM -->
  <div class="card">
    <input placeholder="Item..." />
    <div class="row">
      <input value="1" />
      <input placeholder="Price" type="number" />
    </div>
    <select>
      <option>🛒 Walmart</option>
    </select>
    <button class="add-btn">＋ Add</button>
  </div>

  <!-- AISLE -->
  <div class="section-header">Dairy</div>
  <div class="card" style="border-radius: 0 0 16px 16px;">
    <div class="item">
      <div class="left">
        <div class="checkbox"></div>
        <div>
          <div class="name">milk <span style="color:#a855f7">x1</span><span class="price">$2.99</span></div>
          <div class="sub">🛒 Walmart</div>
        </div>
      </div>
      <div class="actions">✏️ 🗑️</div>
    </div>
  </div>

  <!-- PURCHASED -->
  <div class="purchased-header">Purchased</div>
  <div class="card purchased" style="border-radius: 0 0 16px 16px;">
    <div class="item">
      <div class="left">
        <div class="checkbox checked">✓</div>
        <div>
          <div class="name">eggs <span class="price">$4.98</span></div>
        </div>
      </div>
      <div class="actions">🗑️</div>
    </div>
  </div>

</div>

<!-- FOOTER -->
<div class="footer">
  <div class="footer-inner">
    <div>$7.97</div>
    <div>1 / 2 checked</div>
  </div>
</div>

</body>
</html>
