<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grocery List</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-200 min-h-screen flex flex-col p-4 sm:p-8">

<div class="max-w-3xl mx-auto flex-1 flex flex-col">

  <!-- Header -->
  <div class="flex justify-between items-center mb-2 p-4 rounded-xl shadow bg-[#27395F] border border-[#1a2438] text-white">
    <h1 class="text-2xl font-bold flex items-center gap-2">🛒 Grocery List</h1>
    <!-- Hamburger Menu -->
    <div class="relative flex items-center">
      <button id="menu-btn" class="text-3xl font-bold p-1 hover:text-blue-300">☰</button>
      <div id="menu" class="absolute right-0 mt-2 w-48 rounded-lg shadow-lg border border-blue-400 bg-white z-50 hidden">
        <button onclick="clearPurchased()" class="w-full text-left px-4 py-2 hover:bg-blue-100 text-blue-800 text-sm">Clear Purchased</button>
        <button onclick="clearAll()" class="w-full text-left px-4 py-2 hover:bg-red-100 text-red-700 text-sm">Clear All</button>
        <label class="w-full text-left px-4 py-2 hover:bg-blue-100 text-blue-800 text-sm cursor-pointer block">
          Import Pantry
          <input type="file" id="import-file" class="hidden" accept=".xlsx,.xls">
        </label>
      </div>
    </div>
  </div>

  <!-- Add Item & Search -->
  <div class="mb-4 p-4 rounded-xl shadow bg-[#27395F] border border-[#1a2438] text-white flex flex-col gap-2 relative">
    <div class="flex flex-wrap gap-2">
      <input type="text" id="new-item" placeholder="Item name" class="flex-1 px-3 py-2 rounded text-black min-w-[120px]">
      <input type="number" id="new-quantity" value="1" class="w-16 px-2 py-2 rounded text-black">
      <input type="number" id="new-price" placeholder="Price" class="w-20 px-2 py-2 rounded text-black">
      <button onclick="addItem()" class="flex items-center gap-1 px-4 py-2 bg-blue-500 hover:bg-blue-400 rounded whitespace-nowrap">➕ Add</button>
    </div>
    <div class="relative w-full mt-2">
      <input type="text" id="search-pantry" placeholder="Search pantry (3+ letters)" class="w-full px-3 py-2 rounded text-black">
      <div id="search-results" class="absolute top-full left-0 right-0 bg-white border border-blue-400 max-h-60 overflow-y-auto mt-1 rounded shadow z-50 hidden text-black"></div>
    </div>
  </div>

  <!-- Scrollable Items -->
  <div class="flex-1 overflow-y-auto space-y-2 mb-20" id="items-container"></div>

</div>

<!-- Sticky Cart Total -->
<div class="fixed bottom-0 left-0 right-0 bg-[#27395F] text-white p-4 shadow flex justify-between items-center z-50 rounded-t-xl">
  <div id="cart-total" class="font-bold text-lg">Total: $0.00</div>
</div>

<script>
// ===== Data =====
let items = JSON.parse(localStorage.getItem('groceryItems')||'[]');
let pantry = JSON.parse(localStorage.getItem('pantryItems')||'[]');

// ===== Hamburger Menu Toggle =====
const menuBtn = document.getElementById('menu-btn');
const menu = document.getElementById('menu');
menuBtn.addEventListener('click', () => menu.classList.toggle('hidden'));

// ===== Import Pantry =====
document.getElementById('import-file').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data,{type:'array'});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);
    const newItems = json.map((r,i)=>({
      id:Date.now()+i,
      name:String(r.Item||r.item||r.Name||r.name||''),
      price:String(r.Price||r.price||''),
      aisle:String(r.Aisle||r.aisle||'Other'),
      checked:false,
      quantity:'1'
    })).filter(x=>x.name);
    pantry.push(...newItems);
    alert('Imported '+newItems.length+' pantry items');
    e.target.value='';
  };
  reader.readAsArrayBuffer(file);
});

// ===== Search Pantry =====
const searchInput = document.getElementById('search-pantry');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', function(){
  const q = searchInput.value.trim().toLowerCase();
  searchResults.innerHTML='';
  if(q.length<3){ searchResults.classList.add('hidden'); return; }
  const matches = pantry.filter(p=>p.name.toLowerCase().includes(q));
  if(matches.length===0){ searchResults.innerHTML='<div class="p-2 text-sm text-gray-500">No matches</div>'; searchResults.classList.remove('hidden'); return;}
  matches.forEach(p=>{
    const div = document.createElement('div');
    div.className='p-2 border-b cursor-pointer hover:bg-gray-100 text-black text-sm';
    div.textContent = p.name+(p.price? ` $${p.price}`:'');
    div.onclick = ()=>{ addPantryItem(p); searchInput.value=''; searchResults.classList.add('hidden'); };
    searchResults.appendChild(div);
  });
  searchResults.classList.remove('hidden');
});

document.addEventListener('click', function(e){
  if(!searchInput.contains(e.target) && !searchResults.contains(e.target) && !menu.contains(e.target) && !menuBtn.contains(e.target)){
    searchResults.classList.add('hidden');
    menu.classList.add('hidden');
  }
});

function addPantryItem(p){ 
  items.unshift({
    id:Date.now(),
    name:p.name,
    quantity:p.quantity||'1',
    price:p.price||'',
    aisle:p.aisle||'Other',
    checked:false
  });
  saveRender(); 
}

// ===== CRUD =====
function addItem(){
  const name=document.getElementById('new-item').value.trim();
  const qty=parseInt(document.getElementById('new-quantity').value)||1;
  const price=document.getElementById('new-price').value.trim();
  if(!name) return;
  items.unshift({id:Date.now(), name, quantity:qty, price, aisle:'Other', checked:false});
  document.getElementById('new-item').value=''; document.getElementById('new-quantity').value='1'; document.getElementById('new-price').value='';
  saveRender();
}

function toggleCheck(id){ 
  items = items.map(i=>i.id===id?{...i,checked:!i.checked}:i); 
  saveRender(); 
}
function deleteItem(id){ items=items.filter(i=>i.id!==id); saveRender(); }
function clearPurchased(){ items=items.filter(i=>!i.checked); saveRender(); }
function clearAll(){ if(confirm('Clear all items?')){items=[]; saveRender();} }

function increaseQty(id){
  items = items.map(i=>i.id===id?{...i,quantity:parseInt(i.quantity)+1}:i);
  saveRender();
}
function decreaseQty(id){
  items = items.map(i=>i.id===id?{...i,quantity:Math.max(1,parseInt(i.quantity)-1)}:i);
  saveRender();
}

function saveRender(){ localStorage.setItem('groceryItems',JSON.stringify(items)); render(); }

// ===== Render =====
function render(){
  const container=document.getElementById('items-container');
  container.innerHTML='';

  // Group active items by aisle
  const grouped = {};
  const purchased = [];
  items.forEach(i=>{
    if(i.checked){ purchased.push(i); return; }
    const aisle=i.aisle||'Other';
    if(!grouped[aisle]) grouped[aisle]=[];
    grouped[aisle].push(i);
  });

  // Render active items grouped by aisle
  Object.keys(grouped).sort().forEach(aisle=>{
    const aisleDiv=document.createElement('div');
    aisleDiv.className='bg-white rounded-xl shadow max-h-[400px] overflow-y-auto';
    const header=document.createElement('div');
    header.className='bg-[#27395F] text-white px-2 py-1 sticky top-0 z-10 text-sm font-light';
    header.textContent=aisle;
    aisleDiv.appendChild(header);

    grouped[aisle].forEach(i=>{
      const row=document.createElement('div');
      row.className='flex items-center gap-2 p-2 hover:bg-gray-100 text-sm font-light';
      
      const chk=document.createElement('input'); chk.type='checkbox'; chk.checked=i.checked; chk.onclick=()=>toggleCheck(i.id);

      const nameSpan=document.createElement('span'); nameSpan.textContent=i.name; nameSpan.className='flex-1';

      // Right-aligned price and quantity buttons
      const rightDiv=document.createElement('div'); rightDiv.className='flex items-center gap-1';

      const priceSpan=document.createElement('span'); priceSpan.textContent=i.price ? '$'+(parseFloat(i.price)*parseInt(i.quantity)).toFixed(2) : ''; priceSpan.className='text-sm w-16 text-right';

      const minus=document.createElement('button'); minus.textContent='-'; minus.className='w-7 h-7 rounded-full bg-red-300 text-sm flex items-center justify-center'; minus.onclick=()=>decreaseQty(i.id);
      const qtySpan=document.createElement('span'); qtySpan.textContent=i.quantity; qtySpan.className='w-6 text-center text-sm';
      const plus=document.createElement('button'); plus.textContent='+'; plus.className='w-7 h-7 rounded-full bg-green-300 text-sm flex items-center justify-center'; plus.onclick=()=>increaseQty(i.id);

      rightDiv.appendChild(priceSpan); rightDiv.appendChild(minus); rightDiv.appendChild(qtySpan); rightDiv.appendChild(plus);

      const del=document.createElement('button'); del.textContent='🗑'; del.onclick=()=>deleteItem(i.id);

      row.appendChild(chk); row.appendChild(nameSpan); row.appendChild(rightDiv); row.appendChild(del);
      aisleDiv.appendChild(row);
    });

    container.appendChild(aisleDiv);
  });

  // Purchased section
  if(purchased.length>0){
    const purchasedDiv=document.createElement('div');
    purchasedDiv.className='mt-4';
    const header=document.createElement('div');
    header.className='bg-[#27395F] text-white px-2 py-1 sticky top-0 z-10 text-sm font-light';
    header.textContent='Purchased';
    purchasedDiv.appendChild(header);
    purchased.forEach(i=>{
      const row=document.createElement('div');
      row.className='flex items-center gap-2 p-2 bg-gray-200 rounded-xl hover:bg-gray-300 text-sm font-light';
      
      const chk=document.createElement('input'); chk.type='checkbox'; chk.checked=i.checked; chk.onclick=()=>toggleCheck(i.id);

      const nameSpan=document.createElement('span'); nameSpan.textContent=i.name; nameSpan.className='flex-1 line-through';

      // Right-aligned price and quantity buttons
      const rightDiv=document.createElement('div'); rightDiv.className='flex items-center gap-1';

      const priceSpan=document.createElement('span'); priceSpan.textContent=i.price ? '$'+(parseFloat(i.price)*parseInt(i.quantity)).toFixed(2) : ''; priceSpan.className='text-sm w-16 text-right';

      const minus=document.createElement('button'); minus.textContent='-'; minus.className='w-7 h-7 rounded-full bg-red-300 text-sm flex items-center justify-center'; minus.onclick=()=>decreaseQty(i.id);
      const qtySpan=document.createElement('span'); qtySpan.textContent=i.quantity; qtySpan.className='w-6 text-center text-sm';
      const plus=document.createElement('button'); plus.textContent='+'; plus.className='w-7 h-7 rounded-full bg-green-300 text-sm flex items-center justify-center'; plus.onclick=()=>increaseQty(i.id);

      rightDiv.appendChild(priceSpan); rightDiv.appendChild(minus); rightDiv.appendChild(qtySpan); rightDiv.appendChild(plus);

      const del=document.createElement('button'); del.textContent='🗑'; del.onclick=()=>deleteItem(i.id);

      row.appendChild(chk); row.appendChild(nameSpan); row.appendChild(rightDiv); row.appendChild(del);
      purchasedDiv.appendChild(row);
    });
    container.appendChild(purchasedDiv);
  }

  // Update cart total
  let total = items.reduce((sum,i)=>{
    const price = parseFloat(i.price)||0;
    const qty = parseInt(i.quantity)||1;
    return sum + (price*qty);
  },0);
  document.getElementById('cart-total').textContent = 'Total: $'+total.toFixed(2);
}

render();
</script>

</body>
</html>
