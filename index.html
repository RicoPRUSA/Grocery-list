<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista 🇵🇷 | Grocery App</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Plus: <path d="M12 5v14M5 12h14" />,
                Minus: <path d="M5 12h14" />,
                Trash2: (<><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></>),
                Check: <path d="M20 6 9 17l-5-5" />,
                X: (<><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>),
                ShoppingCart: (<><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></>),
                Edit2: <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />,
                Menu: (<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>),
                Search: (<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>),
                Upload: (<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></>),
                Package: (<><path d="m16.5 9.4-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.27 6.96 8.73 5.05 8.73-5.05M12 22.08V12"/></>),
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const GroceryListApp = () => {
            const [items, setItems] = useState([]);
            const [pantryItems, setPantryItems] = useState([]);
            const [newItem, setNewItem] = useState('');
            const [newQuantity, setNewQuantity] = useState(1);
            const [newPrice, setNewPrice] = useState('');
            const [selectedStore, setSelectedStore] = useState('Walmart');
            const [editingItem, setEditingItem] = useState(null);
            const [showMenu, setShowMenu] = useState(false);
            const [showPantry, setShowPantry] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');

            const aisleMap = {
                '🥦 Produce': ['apple', 'banana', 'orange', 'lettuce', 'tomato', 'onion', 'potato', 'carrot', 'cilantro', 'lime', 'lemon', 'garlic', 'pepper', 'fruit', 'veggie', 'recao', 'aguacate', 'plátano', 'guineo'],
                '🥩 Meat': ['chicken', 'beef', 'pork', 'turkey', 'fish', 'steak', 'bacon', 'ham', 'chorizo', 'sausage', 'ground', 'pollo', 'carne', 'jamón', 'chuleta', 'pavo'],
                '🥛 Dairy': ['milk', 'egg', 'cheese', 'butter', 'yogurt', 'cream', 'half', 'sour cream', 'leche', 'huevo', 'queso', 'mantequilla'],
                '🍞 Bakery': ['bread', 'bagel', 'muffin', 'cake', 'tortilla', 'pan', 'roll', 'bizcocho', 'sobao'],
                '🥫 Canned': ['soup', 'beans', 'corn', 'tuna', 'sauce', 'tomato paste', 'habichuela', 'salsa', 'gandules', 'salchicha'],
                '🍝 Pantry': ['rice', 'pasta', 'cereal', 'flour', 'sugar', 'oil', 'salt', 'pepper', 'spices', 'honey', 'vinegar', 'adobo', 'sazon', 'arroz', 'aceite', 'azúcar', 'avena', 'café', 'coffee'],
                '🥤 Beverages': ['water', 'juice', 'soda', 'coffee', 'beer', 'wine', 'malta', 'drink', 'agua', 'jugo', 'refresco', 'cerveza'],
                '❄️ Frozen': ['ice cream', 'frozen', 'pizza', 'fries', 'nugget', 'helado', 'congelado'],
                '🥨 Snacks': ['chips', 'crackers', 'cookies', 'candy', 'popcorn', 'nuts', 'galletas', 'papas'],
                '🧼 Pharmacy': ['shampoo', 'soap', 'medicine', 'vitamin', 'toothpaste', 'aspirin', 'deodorant', 'jabón', 'pasta de dientes']
            };

            const getAisleForItem = (itemName) => {
                if (!itemName) return '📦 Other';
                const lowerName = itemName.toLowerCase();
                for (const [aisle, keywords] of Object.entries(aisleMap)) {
                    if (keywords.some(keyword => lowerName.includes(keyword))) return aisle;
                }
                return '📦 Other';
            };

            useEffect(() => {
                const savedItems = localStorage.getItem('groceryItems');
                const savedPantry = localStorage.getItem('pantryItems');
                if (savedItems) setItems(JSON.parse(savedItems));
                if (savedPantry) setPantryItems(JSON.parse(savedPantry));
            }, []);

            useEffect(() => { localStorage.setItem('groceryItems', JSON.stringify(items)); }, [items]);
            useEffect(() => { localStorage.setItem('pantryItems', JSON.stringify(pantryItems)); }, [pantryItems]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                        const newItems = jsonData.map((row, index) => {
                            const name = String(row.Item || row.Name || '').trim();
                            return { 
                                id: Date.now() + index, 
                                name, 
                                price: String(row.Price || '').trim(), 
                                aisle: row.Aisle || getAisleForItem(name) 
                            };
                        }).filter(item => item.name);
                        setPantryItems(prev => [...prev, ...newItems]);
                        setShowPantry(true);
                    } catch (err) { alert("Error reading file. Ensure it has an 'Item' column."); }
                };
                reader.readAsArrayBuffer(file);
            };

            const addItem = () => {
                if (!newItem.trim()) return;
                const item = { 
                    id: Date.now(), 
                    name: newItem.trim(), 
                    quantity: parseFloat(newQuantity) || 1, 
                    price: newPrice, 
                    aisle: getAisleForItem(newItem), 
                    checked: false 
                };
                setItems([item, ...items]);
                setNewItem(''); setNewQuantity(1); setNewPrice('');
            };

            const addItemFromPantry = (p) => {
                const item = { 
                    id: Date.now(), 
                    name: p.name, 
                    quantity: 1, 
                    price: p.price || '', 
                    aisle: p.aisle || getAisleForItem(p.name), 
                    checked: false 
                };
                setItems([item, ...items]);
                setSearchQuery('');
            };

            const toggleCheck = (id) => setItems(items.map(i => i.id === id ? { ...i, checked: !i.checked } : i));
            const deleteItem = (id) => setItems(items.filter(i => i.id !== id));
            
            const cartTotal = items.reduce((sum, i) => sum + (parseFloat(i.price || 0) * parseFloat(i.quantity || 1)), 0);
            const filteredPantry = searchQuery.length >= 2 ? pantryItems.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase())) : [];
            const groupedByAisle = items.filter(i => !i.checked).reduce((acc, i) => { (acc[i.aisle] = acc[i.aisle] || []).push(i); return acc; }, {});

            return (
                <div className="min-h-screen pb-32">
                    <div className="max-w-xl mx-auto p-4">
                        
                        {/* Header */}
                        <header className="rounded-2xl shadow-lg px-4 py-4 mb-6 text-white bg-gradient-to-br from-emerald-600 to-teal-800">
                            <div className="flex items-center justify-between mb-4">
                                <div className="flex items-center gap-2">
                                    <Icon name="ShoppingCart" className="w-5 h-5" />
                                    <h1 className="text-base font-black uppercase tracking-tight">Mi Lista 🇵🇷</h1>
                                </div>
                                <button onClick={() => setShowMenu(!showMenu)} className="p-2 hover:bg-white/10 rounded-full transition-colors">
                                    <Icon name="Menu" className="w-5 h-5" />
                                </button>
                            </div>
                            <div className="relative">
                                <Icon name="Search" className="absolute left-3 top-1/2 -translate-y-1/2 text-white/60 w-4 h-4" />
                                <input
                                    type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="Search pantry database..."
                                    className="w-full pl-10 pr-4 py-2 bg-white/10 border border-white/20 rounded-xl text-sm placeholder-white/60 focus:outline-none focus:bg-white/20 transition-all"
                                />
                                {filteredPantry.length > 0 && (
                                    <div className="absolute top-full left-0 right-0 mt-2 bg-white rounded-xl shadow-2xl border z-50 max-h-60 overflow-y-auto overflow-x-hidden">
                                        {filteredPantry.map(p => (
                                            <button key={p.id} onClick={() => addItemFromPantry(p)} className="w-full flex justify-between items-center p-4 hover:bg-emerald-50 border-b last:border-0 text-slate-800 text-left">
                                                <div className="flex flex-col">
                                                    <span className="font-bold text-sm">{p.name}</span>
                                                    <span className="text-[10px] text-slate-400 uppercase font-bold">{p.aisle}</span>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    {p.price && <span className="text-xs text-emerald-600 font-black">${p.price}</span>}
                                                    <div className="p-1 bg-emerald-100 text-emerald-600 rounded"><Icon name="Plus" className="w-4 h-4" /></div>
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </header>

                        {/* Menu */}
                        {showMenu && (
                            <div className="mb-4 bg-white rounded-xl shadow-xl border border-slate-100 overflow-hidden scale-in">
                                <button onClick={() => {setShowPantry(!showPantry); setShowMenu(false)}} className="w-full flex items-center gap-3 px-5 py-3.5 hover:bg-slate-50 border-b text-slate-700 font-bold text-sm">
                                    <Icon name="Package" className="w-5 h-5 text-emerald-500" /> {showPantry ? 'Hide' : 'Show'} Pantry Manager
                                </button>
                                <button onClick={() => {setItems(items.filter(i => !i.checked)); setShowMenu(false)}} className="w-full flex items-center gap-3 px-5 py-3.5 hover:bg-slate-50 border-b text-slate-700 font-bold text-sm">
                                    <Icon name="Check" className="w-5 h-5 text-emerald-500" /> Clear Checked Items
                                </button>
                                <button onClick={() => {if(confirm('Reset all data?')) {setItems([]); setPantryItems([]);} setShowMenu(false)}} className="w-full flex items-center gap-3 px-5 py-3.5 hover:bg-red-50 text-red-600 font-bold text-sm">
                                    <Icon name="Trash2" className="w-5 h-5" /> Reset App
                                </button>
                            </div>
                        )}

                        {/* Pantry Database Section */}
                        {showPantry && (
                            <div className="bg-white rounded-2xl shadow-md p-4 mb-6 border border-emerald-100 scale-in">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="font-black text-slate-700 text-[10px] uppercase tracking-widest">Pantry Database</h2>
                                    <label className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-[10px] font-black cursor-pointer flex items-center gap-2 transition-colors">
                                        <Icon name="Upload" className="w-3 h-3" /> IMPORT EXCEL 
                                        <input type="file" className="hidden" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} />
                                    </label>
                                </div>
                                <div className="max-h-60 overflow-y-auto space-y-2 custom-scrollbar pr-1">
                                    {pantryItems.length === 0 && <p className="text-center text-xs text-slate-400 py-4 italic">No items in database. Import an Excel file.</p>}
                                    {pantryItems.map(p => (
                                        <div key={p.id} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
                                            <div className="flex-1 min-w-0 mr-4">
                                                <p className="text-xs font-bold text-slate-700 truncate">{p.name}</p>
                                                <p className="text-[9px] text-slate-400 font-black uppercase tracking-tighter">{p.aisle}</p>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <div className="relative">
                                                    <span className="absolute left-2 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 font-bold">$</span>
                                                    <input 
                                                        type="number" step="0.01" value={p.price} placeholder="0.00"
                                                        onChange={(e) => setPantryItems(pantryItems.map(x => x.id === p.id ? {...x, price: e.target.value} : x))}
                                                        className="w-16 pl-4 pr-1 py-1.5 text-[11px] font-black border border-slate-200 rounded-lg bg-white focus:ring-1 focus:ring-emerald-400 outline-none"
                                                    />
                                                </div>
                                                <button onClick={() => addItemFromPantry(p)} className="p-2 text-emerald-600 hover:bg-emerald-100 rounded-lg transition-colors"><Icon name="Plus" className="w-4 h-4"/></button>
                                                <button onClick={() => setPantryItems(pantryItems.filter(i => i.id !== p.id))} className="p-2 text-red-300 hover:text-red-500 hover:bg-red-50 rounded-lg"><Icon name="X" className="w-4 h-4"/></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Quick Input Area */}
                        <div className="bg-white rounded-2xl shadow-sm p-3 mb-6 grid grid-cols-12 gap-2 border border-slate-200">
                            <input type="text" placeholder="What do you need?" value={newItem} onChange={e => setNewItem(e.target.value)} onKeyPress={e => e.key === 'Enter' && addItem()} className="col-span-12 sm:col-span-6 p-3 bg-slate-50 border rounded-xl text-sm font-medium focus:ring-2 focus:ring-emerald-500 outline-none"/>
                            <div className="col-span-6 sm:col-span-3 flex items-center bg-slate-50 rounded-xl border px-1">
                                <button onClick={() => setNewQuantity(Math.max(1, newQuantity - 1))} className="p-2 text-slate-400"><Icon name="Minus" className="w-3.5 h-3.5"/></button>
                                <span className="flex-1 text-center font-bold text-xs">{newQuantity}</span>
                                <button onClick={() => setNewQuantity(newQuantity + 1)} className="p-2 text-slate-400"><Icon name="Plus" className="w-3.5 h-3.5"/></button>
                            </div>
                            <button onClick={addItem} className="col-span-6 sm:col-span-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl py-3 transition-all text-xs uppercase">Add Item</button>
                        </div>

                        {/* Main List */}
                        <div className="space-y-6">
                            {Object.entries(groupedByAisle).sort().map(([aisle, aisleItems]) => (
                                <div key={aisle} className="scale-in">
                                    <h3 className="px-1 mb-2 text-[10px] font-black uppercase text-slate-400 tracking-[0.2em]">{aisle}</h3>
                                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 divide-y divide-slate-50 overflow-hidden">
                                        {aisleItems.map(item => (
                                            <div key={item.id} className="p-4 flex gap-4 items-center group">
                                                <button onClick={() => toggleCheck(item.id)} className="w-6 h-6 rounded-lg border-2 border-slate-200 shrink-0 transition-colors" />
                                                <div className="flex-1 min-w-0" onClick={() => setEditingItem(item)}>
                                                    <p className="font-semibold text-slate-700 text-sm truncate">{item.name}</p>
                                                    <div className="flex items-center gap-2 mt-0.5">
                                                        <span className="text-[10px] font-bold text-slate-400">Qty: {item.quantity}</span>
                                                        {item.price && <span className="text-[10px] font-bold text-emerald-600">${(parseFloat(item.price) * item.quantity).toFixed(2)}</span>}
                                                    </div>
                                                </div>
                                                <button onClick={() => deleteItem(item.id)} className="p-2 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="Trash2" className="w-4 h-4"/></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Completed Section */}
                        {items.some(i => i.checked) && (
                            <div className="mt-8 opacity-60">
                                <h3 className="text-[10px] font-black mb-3 uppercase text-slate-400 tracking-widest px-1">Purchased</h3>
                                <div className="bg-white rounded-xl border border-dashed border-slate-200 divide-y divide-slate-50 overflow-hidden">
                                    {items.filter(i => i.checked).map(item => (
                                        <div key={item.id} className="flex items-center gap-3 p-3 text-slate-400">
                                            <button onClick={() => toggleCheck(item.id)} className="w-5 h-5 rounded bg-emerald-500 flex items-center justify-center text-white shrink-0"><Icon name="Check" className="w-3.5 h-3.5"/></button>
                                            <span className="line-through text-xs font-medium truncate flex-1">{item.name}</span>
                                            <button onClick={() => deleteItem(item.id)} className="p-2 text-slate-300 hover:text-red-400"><Icon name="Trash2" className="w-4 h-4"/></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Compact Footer */}
                    {items.length > 0 && (
                        <div className="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-md border-t border-slate-200 py-3 px-6 z-40 shadow-xl">
                            <div className="max-w-xl mx-auto flex justify-between items-center">
                                <div>
                                    <p className="text-[9px] font-black text-emerald-600 uppercase tracking-tighter mb-0.5">Estimated Total</p>
                                    <p className="text-lg font-black text-slate-800 leading-none">${cartTotal.toFixed(2)}</p>
                                </div>
                                <div className="text-right">
                                    <div className="h-1.5 w-20 bg-slate-100 rounded-full mb-1 overflow-hidden">
                                        <div className="h-full bg-emerald-500 transition-all duration-500" style={{width: `${(items.filter(i => i.checked).length / items.length) * 100}%`}}></div>
                                    </div>
                                    <p className="text-[9px] font-bold text-slate-400 uppercase tracking-wide">
                                        {items.filter(i => i.checked).length}/{items.length} Done
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Edit Modal */}
                    {editingItem && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl scale-in">
                                <h2 className="text-sm font-black text-slate-800 mb-5 uppercase tracking-wide">Edit Item</h2>
                                <div className="space-y-4">
                                    <input type="text" value={editingItem.name} onChange={e => setEditingItem({...editingItem, name: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-emerald-500" />
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="flex items-center bg-slate-50 rounded-xl border p-1">
                                            <button onClick={() => setEditingItem({...editingItem, quantity: Math.max(1, editingItem.quantity - 1)})} className="p-2 text-slate-400"><Icon name="Minus" className="w-4 h-4"/></button>
                                            <span className="flex-1 text-center font-black text-sm">{editingItem.quantity}</span>
                                            <button onClick={() => setEditingItem({...editingItem, quantity: editingItem.quantity + 1})} className="p-2 text-slate-400"><Icon name="Plus" className="w-4 h-4"/></button>
                                        </div>
                                        <input type="number" step="0.01" value={editingItem.price} onChange={e => setEditingItem({...editingItem, price: e.target.value})} className="w-full p-3 bg-slate-50 border rounded-xl text-sm font-bold" placeholder="Price" />
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button onClick={() => {setItems(items.map(i => i.id === editingItem.id ? {...editingItem, aisle: getAisleForItem(editingItem.name)} : i)); setEditingItem(null);}} className="flex-1 bg-emerald-600 text-white font-black py-3 rounded-xl shadow-lg uppercase text-xs">Save</button>
                                        <button onClick={() => setEditingItem(null)} className="flex-1 bg-slate-100 text-slate-400 py-3 rounded-xl font-black uppercase text-xs">Cancel</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GroceryListApp />);
    </script>
</body>
</html>
