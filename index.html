<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grocery List</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html { scroll-behavior: smooth; }
  body { background-color: #D7DBE2; font-family: sans-serif; margin:0; padding:0; }
  .price-input { min-width: 3rem; max-width: 5rem; }
  .scrollbar-thin::-webkit-scrollbar { width: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background-color: #888; border-radius: 3px; }
  #lists-container { overflow-y: auto; max-height: calc(100vh - 220px); padding-bottom: 1rem; }
  @media (max-width: 640px) {
    body { padding: 12px; }
    .flex-1.max-w-3xl.mx-auto { padding-left: 8px; padding-right: 8px; }
  }
  .item-row { display: flex; justify-content: space-between; flex-wrap: wrap; padding: 0.5rem; background:white; border-radius:0.75rem; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
  .item-info { flex:1; min-width:120px; color:#1a2438; font-size:0.875rem; }
  .item-actions { display:flex; gap:0.25rem; flex-shrink:0; align-items:center; }
  .pills { display:flex; gap:0.5rem; overflow-x:auto; padding:0.5rem 0; scrollbar-width:thin; }
  .pill-btn { padding:0.25rem 0.75rem; border-radius:9999px; background:#3b82f6; color:white; white-space:nowrap; font-size:0.75rem; }
  .collapsible-header { cursor:pointer; display:flex; justify-content:space-between; align-items:center; padding:0.5rem 0.75rem; font-weight:bold; border-radius:0.75rem; }
  #cart-total-container { position:fixed; bottom:0; left:0; right:0; padding:0.5rem 1rem; background:#27395F; color:white; font-weight:bold; z-index:50; border-top-left-radius:1rem; border-top-right-radius:1rem; display:flex; justify-content:space-between; align-items:center; }
  #menu { z-index:50; }
</style>
</head>
<body class="flex flex-col min-h-screen">

<div class="flex-1 max-w-3xl mx-auto flex flex-col px-4 py-4 sm:px-6 sm:py-6">

  <!-- Header -->
  <div class="flex justify-between items-center mb-3 p-4 rounded-xl shadow-xl bg-[#27395F] border border-[#1a2438] text-white">
    <h1 class="text-2xl font-bold flex items-center gap-2">🛒 Grocery List</h1>
    <div class="relative flex items-center">
      <button id="menu-btn" class="text-3xl font-bold p-1 hover:text-blue-300 bg-transparent">☰</button>
      <div id="menu" class="absolute right-0 mt-2 w-48 rounded-lg shadow-lg border border-blue-400 bg-white hidden">
        <button onclick="clearPurchased()" class="w-full text-left px-4 py-2 hover:bg-blue-100 text-blue-800 text-sm">Clear Purchased</button>
        <button onclick="clearAll()" class="w-full text-left px-4 py-2 hover:bg-red-100 text-red-700 text-sm">Clear All</button>
        <label class="w-full text-left px-4 py-2 hover:bg-blue-100 text-blue-800 text-sm cursor-pointer block">
          Import Pantry
          <input type="file" id="import-file" class="hidden" accept=".xlsx,.xls">
        </label>
      </div>
    </div>
  </div>

  <!-- Add Item & Search -->
  <div class="mb-4 p-4 rounded-xl shadow-xl bg-[#27395F] border border-[#1a2438] text-white flex flex-col gap-2 relative">
    <div class="flex flex-wrap gap-2">
      <input type="text" id="new-item" placeholder="Item name" class="flex-1 px-3 py-2 rounded text-black min-w-[120px]">
      <input type="number" id="new-quantity" value="1" class="w-16 px-2 py-2 rounded text-black">
      <input type="number" id="new-price" placeholder="Price" class="w-20 px-2 py-2 rounded text-black">
      <input type="text" id="new-aisle" placeholder="Aisle" class="w-32 px-2 py-2 rounded text-black">
      <button onclick="addItem()" class="flex items-center gap-1 px-4 py-2 bg-blue-500 hover:bg-blue-400 rounded whitespace-nowrap">➕ Add</button>
    </div>
    <div class="relative w-full mt-2">
      <input type="text" id="search-pantry" placeholder="Search pantry (3+ letters)" class="w-full px-3 py-2 rounded text-black">
      <div id="search-results" class="absolute top-full left-0 right-0 bg-white border border-blue-400 max-h-60 overflow-y-auto mt-1 rounded shadow hidden text-black scrollbar-thin"></div>
    </div>
  </div>

  <!-- Scrollable Lists -->
  <div class="flex-1 overflow-y-auto space-y-4 mb-24" id="lists-container">
    <div id="shopping-list"></div>

    <!-- Pantry Quick-Jump Buttons (pill style) -->
    <div id="pantry-jump-buttons" class="pills"></div>

    <div id="pantry-list"></div>
  </div>
</div>

<!-- Sticky Cart Total -->
<div id="cart-total-container">
  <div id="cart-total">Total: $0.00</div>
</div>

<script>
// ===== Data =====
let items = JSON.parse(localStorage.getItem('groceryItems')||'[]');
let pantry = JSON.parse(localStorage.getItem('pantryItems')||'[]');

// ===== Hamburger Menu Toggle =====
const menuBtn = document.getElementById('menu-btn');
const menu = document.getElementById('menu');
menuBtn.addEventListener('click', () => menu.classList.toggle('hidden'));

// ===== Import Pantry =====
document.getElementById('import-file').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data,{type:'array'});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);
    const newItems = json.map((r,i)=>({
      id:Date.now()+i,
      name:String(r.Item||r.item||r.Name||r.name||''),
      price:String(r.Price||r.price||''),
      aisle:String(r.Aisle||r.aisle||'Other'),
      checked:false,
      quantity:'1'
    })).filter(x=>x.name);
    pantry.push(...newItems);
    alert('Imported '+newItems.length+' pantry items');
    e.target.value='';
    saveRender();
  };
  reader.readAsArrayBuffer(file);
});

// ===== Search Pantry =====
const searchInput = document.getElementById('search-pantry');
const searchResults = document.getElementById('search-results');
searchInput.addEventListener('input', function(){
  const q = searchInput.value.trim().toLowerCase();
  searchResults.innerHTML='';
  if(q.length<3){ searchResults.classList.add('hidden'); return; }
  const matches = pantry.filter(p=>p.name.toLowerCase().includes(q));
  if(matches.length===0){ 
    searchResults.innerHTML='<div class="p-2 text-sm text-gray-500">No matches</div>'; 
    searchResults.classList.remove('hidden'); 
    return;
  }
  matches.forEach(p=>{
    const div = document.createElement('div');
    div.className='p-2 border-b cursor-pointer hover:bg-gray-100 text-black text-sm';
    div.textContent = `${p.name} ${p.price ? '$'+p.price : ''} [${p.aisle}]`;
    div.onclick = ()=>{ addPantryItemToList(p); searchInput.value=''; searchResults.classList.add('hidden'); };
    searchResults.appendChild(div);
  });
  searchResults.classList.remove('hidden');
});

document.addEventListener('click', function(e){
  if(!searchInput.contains(e.target) && !searchResults.contains(e.target) && !menu.contains(e.target) && !menuBtn.contains(e.target)){
    searchResults.classList.add('hidden');
    menu.classList.add('hidden');
  }
});

// ===== CRUD Functions =====
function addPantryItemToList(p){ 
  items.unshift({
    id:Date.now(),
    name:p.name,
    quantity:p.quantity||'1',
    price:p.price||'',
    aisle:p.aisle||'Other',
    checked:false
  });
  saveRender(); 
}

function addItem(){
  const name=document.getElementById('new-item').value.trim();
  const qty=parseInt(document.getElementById('new-quantity').value)||1;
  const price=document.getElementById('new-price').value.trim();
  const aisle=document.getElementById('new-aisle').value.trim() || 'Other';
  if(!name) return;
  items.unshift({id:Date.now(), name, quantity:qty, price, aisle, checked:false});
  pantry.unshift({id:Date.now()+1, name, quantity:qty, price, aisle, checked:false});
  document.getElementById('new-item').value=''; 
  document.getElementById('new-quantity').value='1'; 
  document.getElementById('new-price').value='';
  document.getElementById('new-aisle').value='';
  saveRender();
}

function toggleCheck(id){ 
  items = items.map(i=>i.id===id?{...i,checked:!i.checked}:i); 
  saveRender(); 
}
function deleteItem(id){ items=items.filter(i=>i.id!==id); saveRender(); }
function clearPurchased(){ items=items.filter(i=>!i.checked); saveRender(); }
function clearAll(){ if(confirm('Clear all items?')){items=[]; saveRender();} }

function increaseQty(id){
  items = items.map(i=>i.id===id?{...i,quantity:parseInt(i.quantity)+1}:i);
  saveRender();
}
function decreaseQty(id){
  items = items.map(i=>i.id===id?{...i,quantity:Math.max(1,parseInt(i.quantity)-1)}:i);
  saveRender();
}

// ===== Save & Render =====
function saveRender(){ 
  localStorage.setItem('groceryItems',JSON.stringify(items)); 
  localStorage.setItem('pantryItems',JSON.stringify(pantry));
  render(); 
}

// ===== Render =====
function render(){
  const shoppingDiv = document.getElementById('shopping-list');
  const pantryDiv = document.getElementById('pantry-list');
  const jumpDiv = document.getElementById('pantry-jump-buttons');
  shoppingDiv.innerHTML=''; pantryDiv.innerHTML=''; jumpDiv.innerHTML='';

  // --- Shopping List by aisle ---
  const aisles = [...new Set(items.map(i=>i.aisle||'Other'))];
  aisles.forEach(a=>{
    const aisleDiv = document.createElement('div');
    const header = document.createElement('div');
    header.className='bg-[#27395F] text-white px-2 py-1 cursor-pointer rounded-t';
    header.textContent=a;
    aisleDiv.appendChild(header);
    const container = document.createElement('div');
    container.className='flex flex-col space-y-1 p-2';
    items.filter(i=>i.aisle===a && !i.checked).forEach(i=>{
      const row = document.createElement('div'); row.className='item-row';
      const info = document.createElement('div'); info.className='item-info'; info.textContent=i.name;
      const price = document.createElement('span'); price.textContent='$'+((parseFloat(i.price)||0)*parseInt(i.quantity||1)).toFixed(2); price.className='text-green-600';
      const actions = document.createElement('div'); actions.className='item-actions';
      const minus = document.createElement('button'); minus.textContent='-'; minus.className='bg-[#FF5C5C] text-white px-2 rounded'; minus.onclick=()=>decreaseQty(i.id);
      const plus = document.createElement('button'); plus.textContent='+'; plus.className='bg-[#22C55E] text-white px-2 rounded'; plus.onclick=()=>increaseQty(i.id);
      const del = document.createElement('button'); del.textContent='✖'; del.className='text-red-600'; del.onclick=()=>deleteItem(i.id);
      actions.appendChild(minus); actions.appendChild(plus); actions.appendChild(del);
      row.appendChild(info); row.appendChild(price); row.appendChild(actions);
      container.appendChild(row);
    });
    aisleDiv.appendChild(container);
    shoppingDiv.appendChild(aisleDiv);
  });

  // --- Purchased Section (collapsed by default with arrow) ---
  const purchasedDiv = document.createElement('div');
  const purchasedHeader = document.createElement('div');
  let collapsedPurchased = true;
  purchasedHeader.className='collapsible-header bg-[#27395F] text-white mt-2';
  purchasedHeader.innerHTML = '<span>Purchased</span><span class="arrow">►</span>';
  const purchasedItems = document.createElement('div');
  purchasedItems.className='flex flex-col space-y-1 p-2 hidden';
  purchasedHeader.onclick = ()=>{
    purchasedItems.classList.toggle('hidden');
    collapsedPurchased = !collapsedPurchased;
    purchasedHeader.querySelector('.arrow').textContent = collapsedPurchased ? '►':'▼';
  };
  items.filter(i=>i.checked).forEach(i=>{
    const row = document.createElement('div'); row.className='item-row';
    const info = document.createElement('div'); info.className='item-info line-through text-gray-400'; info.textContent=i.name;
    const price = document.createElement('span'); price.className='line-through text-gray-400'; price.textContent='$'+((parseFloat(i.price)||0)*parseInt(i.quantity||1)).toFixed(2);
    const del = document.createElement('button'); del.textContent='✖'; del.className='text-red-600'; del.onclick=()=>deleteItem(i.id);
    row.appendChild(info); row.appendChild(price); row.appendChild(del);
    purchasedItems.appendChild(row);
  });
  purchasedDiv.appendChild(purchasedHeader); purchasedDiv.appendChild(purchasedItems);
  shoppingDiv.appendChild(purchasedDiv);

  // --- Pantry Quick-Jump Buttons ---
  const pantryAisles = [...new Set(pantry.map(p=>p.aisle||'Other'))];
  pantryAisles.forEach(a=>{
    const btn = document.createElement('button');
    btn.textContent=a;
    btn.className='pill-btn';
    btn.onclick=()=>document.getElementById('pantry-aisle-'+a).scrollIntoView({behavior:'smooth',block:'start'});
    jumpDiv.appendChild(btn);
  });

  // --- Pantry List ---
  pantryAisles.forEach(a=>{
    const aisleDiv = document.createElement('div'); aisleDiv.id='pantry-aisle-'+a;
    const header = document.createElement('div'); let collapsed = true;
    header.className='collapsible-header bg-blue-400 mt-2';
    header.innerHTML=`<span>${a}</span><span class="arrow">►</span>`;
    const container = document.createElement('div'); container.className='flex flex-col space-y-1 p-2 hidden';
    header.onclick = ()=>{
      container.classList.toggle('hidden');
      collapsed = !collapsed;
      header.querySelector('.arrow').textContent = collapsed ? '►':'▼';
    };
    pantry.filter(p=>p.aisle===a).forEach(p=>{
      const row = document.createElement('div'); row.className='item-row';
      const name = document.createElement('div'); name.className='item-info'; name.textContent=p.name;
      const priceInput = document.createElement('input'); priceInput.type='number'; priceInput.step='0.01'; priceInput.value=p.price||''; priceInput.className='price-input px-1 py-1 border rounded text-black';
      priceInput.oninput=()=>{p.price=priceInput.value; saveRender();};
      const addBtn = document.createElement('button'); addBtn.textContent='+'; addBtn.className='w-7 h-7 rounded-full bg-[#22C55E] text-white flex items-center justify-center'; addBtn.onclick=()=>addPantryItemToList(p);
      const actions = document.createElement('div'); actions.className='item-actions'; actions.appendChild(priceInput); actions.appendChild(addBtn);
      row.appendChild(name); row.appendChild(actions);
      container.appendChild(row);
    });
    aisleDiv.appendChild(header); aisleDiv.appendChild(container); pantryDiv.appendChild(aisleDiv);
  });

  // --- Update Cart Total ---
  const total = items.reduce((s,i)=>s + (parseFloat(i.price)||0)*parseInt(i.quantity||1),0);
  document.getElementById('cart-total').textContent='Total: $'+total.toFixed(2);
}

render();
</script>

</body>
</html>
