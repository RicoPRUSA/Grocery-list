<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista 🇵🇷 | Grocery App</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-[#fdfdfd] text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Plus: <path d="M12 5v14M5 12h14" />,
                Trash2: (<><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></>),
                Check: <path d="M20 6 9 17l-5-5" />,
                X: (<><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>),
                ShoppingCart: (<><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></>),
                Edit2: <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />,
                Menu: (<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>),
                Search: (<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>),
                Upload: (<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></>),
                Package: (<><path d="m16.5 9.4-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.27 6.96 8.73 5.05 8.73-5.05M12 22.08V12"/></>),
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const GroceryListApp = () => {
            const [items, setItems] = useState([]);
            const [pantryItems, setPantryItems] = useState([]);
            const [newItem, setNewItem] = useState('');
            const [newQuantity, setNewQuantity] = useState('1');
            const [newPrice, setNewPrice] = useState('');
            const [selectedStore, setSelectedStore] = useState('Walmart');
            const [editingId, setEditingId] = useState(null);
            const [editText, setEditText] = useState('');
            const [editQuantity, setEditQuantity] = useState('');
            const [editPrice, setEditPrice] = useState('');
            const [editStore, setEditStore] = useState('');
            const [showMenu, setShowMenu] = useState(false);
            const [showPantry, setShowPantry] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');

            const stores = ['Walmart', "Sam's Club", 'Coquito', 'Talin Market'];

            const aisleMap = {
                'Dairy': ['milk', 'egg', 'cheese', 'butter', 'yogurt', 'cream'],
                'Produce': ['apple', 'banana', 'orange', 'lettuce', 'tomato', 'onion', 'potato', 'carrot', 'cilantro', 'garlic', 'pepper'],
                'Meat': ['chicken', 'beef', 'pork', 'turkey', 'fish', 'steak', 'bacon', 'ham'],
                'Bakery': ['bread', 'bagel', 'muffin', 'cake', 'tortilla'],
                'Frozen': ['ice cream', 'frozen', 'pizza', 'fries'],
                'Pantry': ['rice', 'pasta', 'cereal', 'flour', 'sugar', 'oil', 'salt', 'honey'],
                'Beverages': ['water', 'juice', 'soda', 'coffee', 'beer', 'wine', 'malta'],
                'Snacks': ['chips', 'crackers', 'cookies', 'candy'],
                'Canned': ['soup', 'beans', 'corn', 'tuna', 'sauce'],
            };

            const getAisleForItem = (itemName) => {
                if (!itemName) return 'Other';
                const lowerName = itemName.toLowerCase();
                for (const [aisle, keywords] of Object.entries(aisleMap)) {
                    if (keywords.some(keyword => lowerName.includes(keyword))) return aisle;
                }
                return 'Other';
            };

            useEffect(() => {
                const savedItems = localStorage.getItem('groceryItems');
                const savedPantry = localStorage.getItem('pantryItems');
                if (savedItems) setItems(JSON.parse(savedItems));
                if (savedPantry) setPantryItems(JSON.parse(savedPantry));
            }, []);

            useEffect(() => { localStorage.setItem('groceryItems', JSON.stringify(items)); }, [items]);
            useEffect(() => { localStorage.setItem('pantryItems', JSON.stringify(pantryItems)); }, [pantryItems]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                        const newItems = jsonData.map((row, index) => {
                            const name = String(row.Item || row.Name || '').trim();
                            return { id: Date.now() + index, name, price: String(row.Price || '').trim(), aisle: row.Aisle || getAisleForItem(name) };
                        }).filter(item => item.name);
                        setPantryItems(prev => [...prev, ...newItems]);
                    } catch (err) { alert("Error reading file."); }
                };
                reader.readAsArrayBuffer(file);
            };

            const addItem = () => {
                if (!newItem.trim()) return;
                setItems([{ id: Date.now(), name: newItem.trim(), quantity: newQuantity || '1', price: newPrice, aisle: getAisleForItem(newItem), store: selectedStore, checked: false }, ...items]);
                setNewItem(''); setNewQuantity('1'); setNewPrice('');
            };

            const addItemFromPantry = (p) => {
                setItems([{ id: Date.now(), name: p.name, quantity: '1', price: p.price || '', aisle: p.aisle || getAisleForItem(p.name), store: selectedStore, checked: false }, ...items]);
                setSearchQuery('');
            };

            const toggleCheck = (id) => setItems(items.map(i => i.id === id ? { ...i, checked: !i.checked } : i));
            const deleteItem = (id) => setItems(items.filter(i => i.id !== id));
            
            const saveEdit = () => {
                setItems(items.map(i => i.id === editingId ? { ...i, name: editText, quantity: editQuantity, price: editPrice, store: editStore, aisle: getAisleForItem(editText) } : i));
                setEditingId(null);
            };

            const cartTotal = items.reduce((sum, i) => sum + (parseFloat(i.price || 0) * parseFloat(i.quantity || 1)), 0);
            const filteredPantry = searchQuery.length >= 2 ? pantryItems.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase())) : [];
            const groupedByAisle = items.filter(i => !i.checked).reduce((acc, i) => { (acc[i.aisle || 'Other'] = acc[i.aisle || 'Other'] || []).push(i); return acc; }, {});

            return (
                <div className="min-h-screen pb-24">
                    <div className="max-w-xl mx-auto p-4">
                        
                        {/* Compact Header: Deep Indigo Theme */}
                        <header className="rounded-xl shadow-sm px-4 py-3 mb-4 text-white bg-[#334155]">
                            <div className="flex items-center justify-between mb-3">
                                <div className="flex items-center gap-2">
                                    <h1 className="text-sm font-black tracking-widest uppercase opacity-90">Mi Lista 🇵🇷</h1>
                                </div>
                                <button onClick={() => setShowMenu(!showMenu)} className="p-1.5 hover:bg-white/10 rounded-lg">
                                    <Icon name="Menu" className="w-5 h-5" />
                                </button>
                            </div>
                            <div className="relative">
                                <div className="absolute left-3 top-1/2 -translate-y-1/2 text-white/40"><Icon name="Search" className="w-4 h-4" /></div>
                                <input
                                    type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="Quick search pantry..."
                                    className="w-full pl-9 pr-4 py-1.5 bg-white/10 border border-white/10 rounded-lg text-sm placeholder-white/40 focus:outline-none focus:bg-white/20 transition-all"
                                />
                                {filteredPantry.length > 0 && (
                                    <div className="absolute top-full left-0 right-0 mt-2 bg-white rounded-lg shadow-xl border border-slate-100 z-50 max-h-52 overflow-y-auto">
                                        {filteredPantry.map(p => (
                                            <button key={p.id} onClick={() => addItemFromPantry(p)} className="w-full flex justify-between p-3 hover:bg-slate-50 border-b last:border-0 text-slate-800 text-left">
                                                <span className="font-semibold text-sm">{p.name}</span>
                                                <Icon name="Plus" className="w-4 h-4 text-slate-400" />
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </header>

                        {showMenu && (
                            <div className="mb-4 bg-white rounded-lg shadow-lg border border-slate-100 overflow-hidden scale-in">
                                <button onClick={() => {setShowPantry(!showPantry); setShowMenu(false)}} className="w-full flex items-center gap-3 px-4 py-3 hover:bg-slate-50 border-b text-slate-600 text-sm">
                                    <Icon name="Package" className="w-4 h-4" /> Pantry Manager
                                </button>
                                <button onClick={() => {setItems(items.filter(i => !i.checked)); setShowMenu(false)}} className="w-full flex items-center gap-3 px-4 py-3 hover:bg-slate-50 border-b text-slate-600 text-sm">
                                    <Icon name="Check" className="w-4 h-4" /> Clear Checked
                                </button>
                                <button onClick={() => {if(confirm('Reset all?')) setItems([]); setShowMenu(false)}} className="w-full flex items-center gap-3 px-4 py-3 hover:bg-red-50 text-red-500 text-sm">
                                    <Icon name="Trash2" className="w-4 h-4" /> Reset App
                                </button>
                            </div>
                        )}

                        {showPantry && (
                            <div className="bg-white rounded-xl shadow-sm p-4 mb-4 border border-slate-200 scale-in">
                                <div className="flex justify-between items-center mb-3">
                                    <h2 className="text-xs font-bold uppercase tracking-widest text-slate-400">Pantry Database</h2>
                                    <label className="bg-[#64748b] text-white px-2 py-1 rounded-md text-[10px] font-bold cursor-pointer uppercase">
                                        Import <input type="file" className="hidden" onChange={handleFileUpload} />
                                    </label>
                                </div>
                                <div className="max-h-48 overflow-y-auto space-y-1.5 custom-scrollbar pr-1">
                                    {pantryItems.map(p => (
                                        <div key={p.id} className="flex justify-between items-center p-2 bg-slate-50 rounded border border-slate-100">
                                            <span className="text-xs font-medium text-slate-600">{p.name}</span>
                                            <div className="flex items-center gap-3">
                                                <input type="number" step="0.01" value={p.price} placeholder="$"
                                                    onChange={(e) => setPantryItems(pantryItems.map(x => x.id === p.id ? {...x, price: e.target.value} : x))}
                                                    className="w-12 text-[11px] font-bold border-b bg-transparent outline-none text-right"
                                                />
                                                <button onClick={() => addItemFromPantry(p)} className="text-[#64748b]"><Icon name="Plus" className="w-4 h-4"/></button>
                                                <button onClick={() => setPantryItems(pantryItems.filter(i => i.id !== p.id))} className="text-slate-300"><Icon name="X" className="w-3 h-3"/></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Input Area */}
                        <div className="bg-white rounded-xl shadow-sm p-3 mb-6 grid grid-cols-12 gap-2 border border-slate-200">
                            <input type="text" placeholder="New item..." value={newItem} onChange={e => setNewItem(e.target.value)} onKeyPress={e => e.key === 'Enter' && addItem()} className="col-span-12 sm:col-span-5 px-3 py-2 bg-slate-50 border border-slate-100 rounded-lg text-sm focus:ring-1 focus:ring-slate-400 outline-none"/>
                            <input type="number" placeholder="Qty" value={newQuantity} onChange={e => setNewQuantity(e.target.value)} className="col-span-4 sm:col-span-2 px-2 py-2 bg-slate-50 border border-slate-100 rounded-lg text-sm focus:ring-1 focus:ring-slate-400 outline-none"/>
                            <input type="number" placeholder="$" value={newPrice} onChange={e => setNewPrice(e.target.value)} className="col-span-8 sm:col-span-2 px-2 py-2 bg-slate-50 border border-slate-100 rounded-lg text-sm focus:ring-1 focus:ring-slate-400 outline-none"/>
                            <button onClick={addItem} className="col-span-12 sm:col-span-3 bg-[#64748b] text-white font-bold rounded-lg py-2 text-xs uppercase tracking-widest shadow-sm">Add</button>
                        </div>

                        {/* List: Sage and Terracotta Accents */}
                        <div className="space-y-4">
                            {Object.entries(groupedByAisle).sort().map(([aisle, aisleItems]) => (
                                <div key={aisle} className="bg-white rounded-xl border border-slate-100 overflow-hidden shadow-sm">
                                    <div className="px-3 py-1 bg-slate-50 text-[9px] font-black uppercase text-slate-400 tracking-[0.2em]">{aisle}</div>
                                    <div className="divide-y divide-slate-50">
                                        {aisleItems.map(item => (
                                            <div key={item.id} className="p-4 flex gap-4 items-start group">
                                                <button onClick={() => toggleCheck(item.id)} className="w-6 h-6 rounded-lg border-2 border-slate-200 mt-1 shrink-0 hover:border-[#64748b] transition-colors" />
                                                
                                                <div className="flex-1 min-w-0">
                                                    {/* Row 1: Item Name */}
                                                    <p className="font-semibold text-slate-700 text-base mb-1">{item.name}</p>
                                                    
                                                    {/* Row 2: Sub-details and Buttons */}
                                                    <div className="flex items-center gap-4">
                                                        <span className="text-xs font-bold text-[#84a59d] bg-[#f0f4f3] px-1.5 py-0.5 rounded">${(parseFloat(item.price || 0) * parseFloat(item.quantity || 1)).toFixed(2)}</span>
                                                        
                                                        <div className="flex gap-3 ml-auto opacity-40 group-hover:opacity-100 transition-opacity">
                                                            <button onClick={() => {setEditingId(item.id); setEditText(item.name); setEditQuantity(item.quantity); setEditPrice(item.price); setEditStore(item.store)}} className="text-slate-400 hover:text-slate-600"><Icon name="Edit2" className="w-4 h-4"/></button>
                                                            <button onClick={() => deleteItem(item.id)} className="text-[#e29578] hover:text-red-600"><Icon name="Trash2" className="w-4 h-4"/></button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Purchased */}
                        {items.some(i => i.checked) && (
                            <div className="mt-8 opacity-40">
                                <h3 className="text-[10px] font-black mb-2 uppercase text-slate-400 tracking-widest px-1">Purchased</h3>
                                <div className="bg-white rounded-lg border border-slate-100 divide-y divide-slate-50">
                                    {items.filter(i => i.checked).map(item => (
                                        <div key={item.id} className="flex items-center gap-3 p-3">
                                            <button onClick={() => toggleCheck(item.id)} className="w-5 h-5 rounded bg-slate-300 flex items-center justify-center text-white"><Icon name="Check" className="w-3 h-3"/></button>
                                            <span className="line-through text-sm font-medium text-slate-400 flex-1">{item.name}</span>
                                            <button onClick={() => deleteItem(item.id)} className="text-slate-300"><Icon name="Trash2" className="w-4 h-4"/></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Footer: Discreet Styling */}
                    {items.length > 0 && (
                        <div className="fixed bottom-0 inset-x-0 bg-white/80 backdrop-blur-md border-t border-slate-100 py-3 px-6 z-40">
                            <div className="max-w-xl mx-auto flex justify-between items-center">
                                <div>
                                    <p className="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-0.5">Estimated</p>
                                    <p className="text-lg font-bold text-slate-700 leading-none">${cartTotal.toFixed(2)}</p>
                                </div>
                                <div className="text-right">
                                    <div className="h-1 w-16 bg-slate-100 rounded-full mb-1 overflow-hidden">
                                        <div className="h-full bg-[#84a59d] transition-all duration-700" style={{width: `${(items.filter(i => i.checked).length / items.length) * 100}%`}}></div>
                                    </div>
                                    <p className="text-[8px] font-bold text-slate-400 uppercase tracking-widest">
                                        {items.filter(i => i.checked).length}/{items.length} Done
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Edit Modal */}
                    {editingId && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl p-6 w-full max-w-sm shadow-xl scale-in border">
                                <h2 className="text-sm font-black text-slate-700 mb-4 uppercase tracking-widest">Edit Entry</h2>
                                <div className="space-y-4">
                                    <input type="text" value={editText} onChange={e => setEditText(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-lg text-sm outline-none" />
                                    <div className="grid grid-cols-2 gap-3">
                                        <input type="number" value={editQuantity} onChange={e => setEditQuantity(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-lg text-sm" placeholder="Qty" />
                                        <input type="number" value={editPrice} onChange={e => setEditPrice(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-lg text-sm" placeholder="Price" />
                                    </div>
                                    <select value={editStore} onChange={e => setEditStore(e.target.value)} className="w-full p-3 bg-slate-50 border rounded-lg text-sm">
                                        {stores.map(s => <option key={s} value={s}>{s}</option>)}
                                    </select>
                                    <div className="flex gap-2 pt-2">
                                        <button onClick={saveEdit} className="flex-1 bg-[#64748b] text-white font-bold py-3 rounded-lg text-xs uppercase tracking-widest">Update</button>
                                        <button onClick={() => setEditingId(null)} className="flex-1 bg-slate-100 text-slate-400 py-3 rounded-lg text-xs font-bold uppercase tracking-widest">Cancel</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GroceryListApp />);
    </script>
</body>
</html>
