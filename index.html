<body class="text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCfuw-UnRXxGuaRhOsqfIalkzuy7rgU6Ao",
            authDomain: "mi-lista-bc5a2.firebaseapp.com",
            projectId: "mi-lista-bc5a2",
            databaseURL: "https://mi-lista-bc5a2-default-rtdb.firebaseio.com",
            storageBucket: "mi-lista-bc5a2.firebasestorage.app",
            messagingSenderId: "145809393270",
            appId: "1:145809393270:web:2c6053e877e6e9f0c54157"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const { useState, useEffect, useRef, useMemo } = React;

        const AISLE_ORDER = [
            'Pharmacy', 'Pet', 'Garden', 'Housewares', 'Hardware', 'Auto', 'Outdoors', 'Clothing',
            'Electronics', 'Arts & Crafts', 'Office Supplies', 'Spirits', 'Baby Aisle', 'Other',
            'Frozen Food', 'Dairy',
            'Aisle 30', 'Aisle 28', 'Aisle 26', 'Aisle 24', 'Aisle 22', 'Aisle 20', 'Aisle 18',
            'Deli',
            'Aisle 16', 'Aisle 14', 'Aisle 12', 'Aisle 10', 'Aisle 8', 'Aisle 6', 'Aisle 4',
            'Meat & Seafood', 'Aisle 2', 'Bakery', 'Produce', "Sam's Club"
        ];

        const getAisleWeight = (name) => {
            const index = AISLE_ORDER.indexOf(name);
            return index === -1 ? 999 : index;
        };

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                Plus: <path d="M12 5v14M5 12h14" />,
                Minus: <path d="M5 12h14" />,
                Trash2: (<><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></>),
                Check: <path d="M20 6 9 17l-5-5" />,
                X: (<><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>),
                ShoppingCart: (<><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></>),
                Menu: (<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>),
                Search: (<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>),
                Mic: (<><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></>),
                Square: <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />,
                Download: (<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></>),
                Package: (<><path d="m16.5 9.4-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.27 6.96 8.73 5.05 8.73-5.05M12 22.08V12"/></>),
                Upload: (<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></>),
                ChevronDown: <path d="m6 9 6 6 6-6" />,
                ChevronRight: <path d="m9 18 6-6-6-6" />,
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const SwipeableRow = ({ onSwipeRight, onSwipeLeft, children, rightIcon = "Check", leftIcon = "Trash2", rightColor = "bg-emerald-500", leftColor = "bg-red-500" }) => {
            const [startX, setStartX] = useState(0);
            const [offsetX, setOffsetX] = useState(0);
            const threshold = 100;
            const handleStart = (e) => setStartX(e.touches[0].clientX);
            const handleMove = (e) => { setOffsetX(e.touches[0].clientX - startX); };
            const handleEnd = () => {
                if (offsetX > threshold) onSwipeRight();
                else if (offsetX < -threshold) onSwipeLeft();
                setOffsetX(0);
            };
            return (
                <div className="swipe-row-container">
                    <div className={`swipe-action swipe-right-bg ${rightColor}`} style={{ opacity: offsetX > 0 ? 1 : 0 }}><Icon name={rightIcon} /></div>
                    <div className={`swipe-action swipe-left-bg ${leftColor}`} style={{ opacity: offsetX < 0 ? 1 : 0 }}><Icon name={leftIcon} /></div>
                    <div className="swipe-content border-b border-slate-50 last:border-0" style={{ transform: `translateX(${offsetX}px)` }} onTouchStart={handleStart} onTouchMove={handleMove} onTouchEnd={handleEnd}>
                        {children}
                    </div>
                </div>
            );
        };

        const GroceryListApp = () => {
            const stores = [
                { id: 'Walmart', icon: 'ShoppingCart', color: 'text-blue-500', label: 'Walmart' },
                { id: "Sam's Club", icon: 'Package', color: 'text-orange-700', label: "Sam's" },
                { id: 'Coquito', icon: '🥥', isEmoji: true, label: 'Coquito' },
                { id: 'Talin Market', icon: '🇵🇷', isEmoji: true, label: 'Talin' }
            ];
            
            const [items, setItems] = useState([]);
            const [pantryItems, setPantryItems] = useState([]);
            const [syncCode, setSyncCode] = useState(localStorage.getItem('syncCode') || 'Familia');
            const [tempSyncCode, setTempSyncCode] = useState(syncCode);
            const [currentStore, setCurrentStore] = useState('Walmart');
            const [editingItem, setEditingItem] = useState(null);
            const [showMenu, setShowMenu] = useState(false);
            const [showPantry, setShowPantry] = useState(false);
            const [showSyncModal, setShowSyncModal] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [isListening, setIsListening] = useState(false);
            const [expandedAisles, setExpandedAisles] = useState({});
            
            const searchRef = useRef(null);
            const recognitionRef = useRef(null);

            useEffect(() => {
                const listRef = db.ref(`lists/${syncCode}/items`);
                listRef.on('value', (snap) => {
                    const data = snap.val();
                    setItems(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
                });
                const pantryRef = db.ref(`lists/${syncCode}/pantry`);
                pantryRef.on('value', (snap) => {
                    const data = snap.val();
                    setPantryItems(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
                });
                return () => { listRef.off(); pantryRef.off(); };
            }, [syncCode]);

            const updateSyncCode = () => {
                const code = tempSyncCode.trim();
                if(!code) return;
                setSyncCode(code);
                localStorage.setItem('syncCode', code);
                setShowSyncModal(false);
            };

            const addItemManually = (name, price = "") => {
                if (!name.trim()) return;
                const match = pantryItems.find(p => p.name.toLowerCase() === name.trim().toLowerCase());
                const finalPrice = price || (match ? match.price : '');
                const aisle = match ? match.aisle : 'Other';
                db.ref(`lists/${syncCode}/items`).push({ name: name.trim(), quantity: 1, price: finalPrice, aisle, store: currentStore, checked: false });
                if (!match) db.ref(`lists/${syncCode}/pantry`).push({ name: name.trim(), price: finalPrice, aisle });
                setSearchQuery('');
            };

            const addItemFromPantry = (p) => {
                db.ref(`lists/${syncCode}/items`).push({ name: p.name, quantity: 1, price: p.price || '', aisle: p.aisle, store: currentStore, checked: false });
                setSearchQuery('');
            };

            const toggleCheck = (id, currentStatus) => db.ref(`lists/${syncCode}/items/${id}`).update({ checked: !currentStatus });
            const deleteItem = (id) => db.ref(`lists/${syncCode}/items/${id}`).remove();

            const saveModalChanges = () => {
                if (!editingItem) return;
                db.ref(`lists/${syncCode}/items/${editingItem.id}`).update({ ...editingItem });
                const existingPantry = pantryItems.find(p => p.name.toLowerCase() === editingItem.name.toLowerCase());
                if (existingPantry) {
                    db.ref(`lists/${syncCode}/pantry/${existingPantry.id}`).update({ price: editingItem.price, aisle: editingItem.aisle });
                } else {
                    db.ref(`lists/${syncCode}/pantry`).push({ name: editingItem.name, price: editingItem.price, aisle: editingItem.aisle });
                }
                setEditingItem(null);
            };

            const updatePantryPriceAndSyncList = (id, name, newPrice) => {
                db.ref(`lists/${syncCode}/pantry/${id}`).update({ price: newPrice });
                items.forEach(item => {
                    if (item.name.toLowerCase() === name.toLowerCase()) {
                        db.ref(`lists/${syncCode}/items/${item.id}`).update({ price: newPrice });
                    }
                });
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                        
                        // Override logic: Collect everything and set the whole object
                        const newPantryObject = {};
                        const seenNames = new Set();
                        
                        jsonData.forEach((row) => {
                            const nameKey = Object.keys(row).find(k => ['item', 'name', 'producto'].includes(k.toLowerCase()));
                            const name = nameKey ? String(row[nameKey]).trim() : '';
                            if (name && !seenNames.has(name.toLowerCase())) {
                                seenNames.add(name.toLowerCase());
                                const id = 'pantry_' + Math.random().toString(36).substr(2, 9);
                                newPantryObject[id] = {
                                    name: name,
                                    price: (row.Price || row.price || '').toString(),
                                    aisle: row.Aisle || row.aisle || 'Other'
                                };
                            }
                        });
                        
                        db.ref(`lists/${syncCode}/pantry`).set(newPantryObject);
                        alert("Pantry overridden with new data!");
                    } catch (err) { alert("Error reading file."); }
                };
                reader.readAsArrayBuffer(file);
            };

            const exportPantryToExcel = () => {
                const data = pantryItems.map(p => ({ Item: p.name, Price: p.price, Aisle: p.aisle }));
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Pantry");
                XLSX.writeFile(wb, "Mi_Pantry_Database.xlsx");
                setShowMenu(false);
            };

            const toggleVoiceSearch = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return;
                if (isListening) { recognitionRef.current?.stop(); return; }
                const recognition = new SpeechRecognition();
                recognition.lang = 'es-PR';
                recognition.onstart = () => setIsListening(true);
                recognition.onend = () => setIsListening(false);
                recognition.onresult = (e) => setSearchQuery(e.results[0][0].transcript);
                recognitionRef.current = recognition;
                recognition.start();
            };

            const storeItems = useMemo(() => items.filter(i => i.store === currentStore), [items, currentStore]);
            const cartTotal = storeItems.reduce((sum, i) => sum + (parseFloat(i.price || 0) * parseFloat(i.quantity || 1)), 0);
            const aisleStats = useMemo(() => {
                const stats = {};
                storeItems.forEach(item => {
                    const aisle = item.aisle || 'Other';
                    if (!stats[aisle]) stats[aisle] = { total: 0, checked: 0 };
                    stats[aisle].total++;
                    if (item.checked) stats[aisle].checked++;
                });
                return stats;
            }, [storeItems]);

            const sortedAisles = useMemo(() => {
                const groups = storeItems.filter(i => !i.checked).reduce((acc, i) => { 
                    const a = i.aisle || 'Other';
                    (acc[a] = acc[a] || []).push(i); return acc; 
                }, {});
                return Object.entries(groups)
                    .sort((a, b) => getAisleWeight(a[0]) - getAisleWeight(b[0]))
                    .map(([name, groupItems]) => [name, [...groupItems].sort((x, y) => x.name.localeCompare(y.name))]);
            }, [storeItems]);

            const groupedPantry = useMemo(() => {
                const groups = pantryItems.reduce((acc, p) => {
                    const a = p.aisle || 'Other';
                    (acc[a] = acc[a] || []).push(p); return acc;
                }, {});
                return Object.entries(groups)
                    .sort((a, b) => getAisleWeight(a[0]) - getAisleWeight(b[0]))
                    .map(([name, pItems]) => [name, [...pItems].sort((x, y) => x.name.localeCompare(y.name))]);
            }, [pantryItems]);

            const pantryResults = searchQuery.length > 0 ? pantryItems.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase())) : [];

            return (
                <div className="min-h-screen pb-32">
                    <div className="max-w-2xl mx-auto px-2 sm:px-4 py-4 text-slate-900">
                        
                        {/* Auto-Close Backdrops */}
                        {showMenu && <div className="fixed inset-0 z-[55] bg-transparent" onClick={() => setShowMenu(false)} />}
                        {showPantry && <div className="fixed inset-0 z-[55] bg-black/10 backdrop-blur-[2px]" onClick={() => setShowPantry(false)} />}

                        <header className="relative rounded-2xl profound-shadow px-4 sm:px-6 py-4 text-white bg-gradient-to-br from-emerald-600 to-teal-800 mb-3 z-50">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <button onClick={() => { setShowSyncModal(true); setTempSyncCode(syncCode); }} className="bg-white/20 p-2 rounded-lg active:scale-90 transition-all shadow-inner">
                                        <Icon name="ShoppingCart" className="w-5 h-5" />
                                    </button>
                                    <h1 className="text-lg font-black uppercase tracking-tight" onClick={() => setShowSyncModal(true)}>Mi Lista 🇵🇷</h1>
                                </div>
                                <div className="flex items-center gap-1">
                                    <button onClick={() => setShowPantry(!showPantry)} className={`p-2 rounded-full transition-all active:scale-90 ${showPantry ? 'bg-white text-emerald-700 shadow-inner' : 'hover:bg-white/10 text-white/80'}`}><Icon name="Package" className="w-5 h-5" /></button>
                                    <button onClick={() => setShowMenu(!showMenu)} className="p-2 hover:bg-white/10 rounded-full transition-colors active:scale-90"><Icon name={showMenu ? "X" : "Menu"} className="w-6 h-6" /></button>
                                </div>
                            </div>
                            {showMenu && (
                                <div className="absolute top-full left-0 right-0 mt-2 bg-white rounded-xl profound-shadow border border-slate-100 overflow-hidden scale-in z-[60] text-slate-700 mx-1" onClick={(e) => e.stopPropagation()}>
                                    <div className="p-4 bg-slate-50 border-b">
                                        <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Sync Code</label>
                                        <div className="flex gap-2">
                                            <input type="text" value={tempSyncCode} onChange={(e) => setTempSyncCode(e.target.value)} onFocus={(e) => e.target.select()} autoComplete="off" spellCheck="false" className="flex-1 p-2 bg-white border rounded text-sm font-bold outline-none focus:ring-2 focus:ring-emerald-500" />
                                            <button onClick={updateSyncCode} className="bg-emerald-600 text-white px-3 rounded font-black text-[10px] uppercase">Update</button>
                                        </div>
                                    </div>
                                    <button onClick={exportPantryToExcel} className="w-full flex items-center gap-3 px-6 py-4 hover:bg-slate-50 border-b font-bold text-sm text-slate-600 transition-colors text-left"><Icon name="Download" /> Export Pantry Database</button>
                                    <button onClick={() => { storeItems.filter(i => i.checked).forEach(i => db.ref(`lists/${syncCode}/items/${i.id}`).remove()); setShowMenu(false); }} className="w-full flex items-center gap-3 px-6 py-4 hover:bg-slate-50 border-b font-bold text-sm text-emerald-600 transition-colors text-left"><Icon name="Check" /> Clear Purchased ({currentStore})</button>
                                    <button onClick={() => { if(confirm('Delete all for '+currentStore+'?')) { storeItems.forEach(i => db.ref(`lists/${syncCode}/items/${i.id}`).remove()); setShowMenu(false); }}} className="w-full flex items-center gap-3 px-6 py-4 hover:bg-red-50 border-b font-bold text-sm text-red-600 transition-colors text-left"><Icon name="Trash2" /> Reset {currentStore} List</button>
                                    <button onClick={() => { if(confirm('Factory Reset Entire App?')) { db.ref(`lists/${syncCode}`).remove(); localStorage.clear(); location.reload(); }}} className="w-full flex items-center gap-3 px-6 py-4 hover:bg-red-100 font-bold text-sm text-red-700 transition-colors text-left"><Icon name="X" /> Wipe All Data</button>
                                </div>
                            )}
                        </header>

                        <div className="flex gap-2 overflow-x-auto pb-4 px-1 no-scrollbar mb-4">
                            {stores.map(s => (
                                <button key={s.id} onClick={() => setCurrentStore(s.id)} className={`flex items-center gap-2 whitespace-nowrap px-4 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all ${currentStore === s.id ? 'bg-white text-slate-800 shadow-lg profound-shadow ring-2 ring-emerald-500/20' : 'bg-white/50 text-slate-400 opacity-70'}`}>
                                    {s.isEmoji ? <span className="text-sm">{s.icon}</span> : <Icon name={s.icon} className={`w-4 h-4 ${s.color}`} />}{s.label}
                                </button>
                            ))}
                        </div>

                        <div className="relative z-40 mb-8">
                            <Icon name="Search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4" />
                            <input ref={searchRef} type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && addItemManually(searchQuery)} placeholder={isListening ? "Listening..." : "Search or add items..."} className={`w-full pl-11 pr-14 py-4 bg-white border border-slate-100 rounded-xl profound-shadow text-sm placeholder-slate-400 focus:outline-none transition-all font-medium text-slate-900 ${isListening ? 'border-red-500 ring-4 ring-red-100' : 'focus:ring-2 focus:ring-emerald-500'}`} />
                            <button onClick={toggleVoiceSearch} className="absolute right-3 top-1/2 -translate-y-1/2 p-2.5 hover:bg-slate-50 rounded-full active:scale-90 z-50">
                                {isListening ? <Icon name="Square" className="w-5 h-5 text-red-600 pulse-red" /> : <Icon name="Mic" className="w-5 h-5 text-slate-400" />}
                            </button>
                            {searchQuery.length > 0 && (
                                <div className="absolute top-full left-0 right-0 mt-3 bg-white rounded-xl shadow-2xl border border-slate-100 z-50 max-h-64 overflow-y-auto scale-in">
                                    <button onClick={() => addItemManually(searchQuery)} className="w-full flex items-center gap-4 p-4 hover:bg-emerald-50 border-b text-emerald-600 font-black text-sm text-left"><div className="p-1.5 bg-emerald-100 rounded-lg"><Icon name="Plus" className="w-4 h-4" /></div>Add "{searchQuery}"</button>
                                    {pantryResults.map(p => (<button key={p.id} onClick={() => addItemFromPantry(p)} className="w-full flex justify-between items-center p-4 hover:bg-slate-50 border-b last:border-0 text-left"><div><span className="font-bold text-sm block">{p.name}</span><span className="text-[10px] text-slate-500 uppercase font-black tracking-tighter">{p.aisle}</span></div><div className="p-1.5 bg-slate-100 text-slate-400 rounded-lg"><Icon name="Plus" className="w-4 h-4" /></div></button>))}
                                </div>
                            )}
                        </div>

                        {showPantry && (
                            <div className="fixed top-20 left-2 right-2 max-w-2xl mx-auto z-[70] bg-white rounded-2xl profound-shadow p-5 mb-8 border border-emerald-50 scale-in" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-5 border-b border-slate-50 pb-3">
                                    <h2 className="font-black text-slate-700 text-[10px] uppercase tracking-[0.2em] flex items-center gap-2"><Icon name="Package" className="w-3 h-3 text-emerald-500" /> Pantry Database</h2>
                                    <label className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-[10px] font-black cursor-pointer shadow-md active:scale-95 transition-all"><Icon name="Upload" className="w-3 h-3 inline mr-1" /> IMPORT<input type="file" className="hidden" onChange={handleFileUpload} /></label>
                                </div>
                                <div className="max-h-[60vh] overflow-y-auto space-y-2 custom-scrollbar pr-2">
                                    {groupedPantry.map(([aisle, pItems]) => (
                                        <div key={aisle} className="border-b last:border-0">
                                            <button onClick={() => setExpandedAisles(prev => ({ ...prev, [aisle]: !prev[aisle] }))} className="w-full flex items-center justify-between py-3 text-left focus:outline-none">
                                                <div className="flex items-center gap-3">
                                                    <Icon name={expandedAisles[aisle] ? "ChevronDown" : "ChevronRight"} className="w-4 h-4 text-slate-400" />
                                                    <span className="text-[10px] font-black uppercase text-slate-600 tracking-widest">{aisle} ({pItems.length})</span>
                                                </div>
                                            </button>
                                            {expandedAisles[aisle] && (
                                                <div className="space-y-4 pb-4 animate-in fade-in duration-200">
                                                    {pItems.map(p => (
                                                        <SwipeableRow key={p.id} onSwipeLeft={() => db.ref(`lists/${syncCode}/pantry/${p.id}`).remove()} onSwipeRight={() => addItemFromPantry(p)} rightIcon="Plus">
                                                            <div className="flex justify-between items-center p-4 bg-slate-50 rounded-xl">
                                                                <div className="flex-1 mr-4"><p className="text-xs font-bold text-slate-700">{p.name}</p></div>
                                                                <div className="flex items-center gap-4">
                                                                    <input type="number" step="0.01" value={p.price} onClick={(e) => e.stopPropagation()} onChange={(e) => updatePantryPriceAndSyncList(p.id, p.name, e.target.value)} className="w-16 p-2 text-[11px] font-black border rounded-lg bg-white outline-none focus:ring-1 focus:ring-emerald-400" />
                                                                    <button onClick={(e) => { e.stopPropagation(); addItemFromPantry(p); }} className="p-2 text-emerald-600 hover:bg-emerald-50 rounded-lg active:scale-90"><Icon name="Plus" className="w-5 h-5"/></button>
                                                                </div>
                                                            </div>
                                                        </SwipeableRow>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* --- UNIFIED AISLE CARDS --- */}
                        <div className="space-y-12">
                            {sortedAisles.map(([aisle, aisleItems]) => (
                                <div key={aisle} className="scale-in">
                                    <div className="flex justify-between items-end px-2 mb-3">
                                        <div className="space-y-1 flex-1">
                                            <h3 className="text-[10px] font-black uppercase text-slate-600 tracking-[0.3em]">{aisle}</h3>
                                            <div className="h-1 bg-slate-300/30 rounded-full w-24 overflow-hidden"><div className="h-full bg-emerald-500 transition-all duration-700" style={{ width: `${(aisleStats[aisle]?.checked / aisleStats[aisle]?.total) * 100}%` }} /></div>
                                        </div>
                                        <span className="text-[9px] font-bold text-slate-500 uppercase tracking-widest">{aisleStats[aisle]?.checked}/{aisleStats[aisle]?.total} Done</span>
                                    </div>

                                    {/* All Items in one card per Aisle */}
                                    <div className="bg-white rounded-2xl profound-shadow border border-slate-50 overflow-hidden divide-y divide-slate-50">
                                        {aisleItems.map(item => (
                                            <SwipeableRow key={item.id} onSwipeLeft={() => deleteItem(item.id)} onSwipeRight={() => toggleCheck(item.id, item.checked)}>
                                                <div className="flex items-center p-5 gap-5 active:bg-slate-50 transition-colors">
                                                    <button onClick={(e) => { e.stopPropagation(); toggleCheck(item.id, item.checked); }} className={`w-7 h-7 rounded-lg border-2 shrink-0 flex items-center justify-center transition-all ${item.checked ? 'bg-emerald-500 border-emerald-500' : 'border-slate-100'}`}>{item.checked && <Icon name="Check" className="w-4 h-4 text-white" />}</button>
                                                    <div className="flex-1 min-w-0" onClick={() => setEditingItem({...item})}>
                                                        <p className="font-bold text-slate-700 text-sm truncate">{item.name}</p>
                                                        <div className="flex items-center gap-3 mt-1">
                                                            <span className="text-[10px] font-black text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md uppercase">x{item.quantity}{item.unit || "ea"}</span>
                                                            {item.price && <span className="text-[10px] font-black text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md tracking-wider">${(parseFloat(item.price) * item.quantity).toFixed(2)}</span>}
                                                        </div>
                                                    </div>
                                                </div>
                                            </SwipeableRow>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {storeItems.some(i => i.checked) && (
                            <div className="mt-16 opacity-50 text-center"><h3 className="text-[10px] font-black mb-4 uppercase text-slate-600 tracking-[0.3em] px-2 italic">In {currentStore} Cart</h3><div className="bg-white/40 rounded-xl border border-dashed border-slate-300 divide-y overflow-hidden mx-1">
                                {storeItems.filter(i => i.checked).map(item => (
                                    <div key={item.id} className="flex items-center gap-4 p-4 hover:bg-white/50 transition-colors">
                                        <button onClick={() => toggleCheck(item.id, true)} className="w-6 h-6 rounded-md bg-emerald-500 flex items-center justify-center text-white shrink-0 active:scale-90"><Icon name="Check" className="w-4 h-4"/></button>
                                        <span className="line-through text-xs font-semibold text-slate-500 truncate flex-1 text-left">{item.name}</span>
                                        <button onClick={() => deleteItem(item.id)} className="p-2 text-slate-300 hover:text-red-400 transition-colors"><Icon name="Trash2" className="w-4 h-4"/></button>
                                    </div>
                                ))}
                            </div></div>
                        )}
                    </div>

                    {/* Footer Progress & Total */}
                    {storeItems.length > 0 && (
                        <div className="fixed bottom-0 inset-x-0 bg-white/80 backdrop-blur-xl border-t border-slate-200 py-4 px-8 z-40 shadow-2xl text-slate-900"><div className="max-w-2xl mx-auto flex justify-between items-center text-slate-900"><div><p className="text-[9px] font-black text-emerald-600 uppercase tracking-widest mb-1">{currentStore} Total</p><p className="text-base font-black text-slate-800 leading-none">${cartTotal.toFixed(2)}</p></div><div className="text-right"><div className="h-2 w-24 bg-slate-200 rounded-full mb-1.5 overflow-hidden"><div className="h-full bg-emerald-500 transition-all duration-1000 shadow-[0_0_10px_rgba(16,185,129,0.5)]" style={{width: `${(storeItems.filter(i => i.checked).length / storeItems.length) * 100}%`}}></div></div><p className="text-[9px] font-black text-slate-500 uppercase tracking-widest">{storeItems.filter(i => i.checked).length}/{storeItems.length} Done</p></div></div></div>
                    )}

                    {/* Sync Modal */}
                    {showSyncModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-md z-[110] flex items-center justify-center p-6" onClick={() => setShowSyncModal(false)}>
                            <div className="bg-white rounded-2xl p-8 w-full max-w-sm profound-shadow scale-in" onClick={(e) => e.stopPropagation()}>
                                <h2 className="text-lg font-black text-slate-800 mb-6 tracking-tight">Sync Settings</h2>
                                <div className="space-y-4">
                                    <label className="text-[9px] font-black text-slate-400 uppercase ml-1 block">Private Sync Code</label>
                                    <input type="text" value={tempSyncCode} onChange={(e) => setTempSyncCode(e.target.value)} autoComplete="off" spellCheck="false" className="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-emerald-500" />
                                    <button onClick={updateSyncCode} className="w-full bg-emerald-600 text-white font-black py-4 rounded-xl uppercase text-[10px] tracking-widest active:scale-95 shadow-lg transition-all">Update & Connect</button>
                                    <button onClick={() => setShowSyncModal(false)} className="w-full py-2 text-slate-400 text-[10px] font-black uppercase text-center tracking-widest">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {editingItem && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-md z-[100] flex items-center justify-center p-4 text-slate-900" onClick={() => setEditingItem(null)}>
                            <div className="bg-white rounded-2xl p-8 w-full max-w-sm profound-shadow scale-in" onClick={(e) => e.stopPropagation()}>
                                <h2 className="text-sm font-black text-slate-800 mb-6 uppercase border-b pb-2 tracking-widest text-center">Edit Details</h2>
                                <div className="space-y-6">
                                    <div><label className="text-[9px] font-black text-slate-500 uppercase block ml-1">Name</label><input type="text" value={editingItem.name} onChange={e => setEditingItem({...editingItem, name: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-emerald-500" /></div>
                                    <div className="grid grid-cols-12 gap-3">
                                        <div className="col-span-7 space-y-1">
                                            <label className="text-[9px] font-black text-slate-500 uppercase block ml-1">Qty</label>
                                            <div className="flex items-center bg-slate-50 rounded-xl border p-1">
                                                <button onClick={() => setEditingItem({...editingItem, quantity: Math.max(1, editingItem.quantity - 1)})} className="p-3 text-slate-400"><Icon name="Minus" className="w-4 h-4"/></button>
                                                <span className="flex-1 text-center font-black text-sm">{editingItem.quantity}</span>
                                                <button onClick={() => setEditingItem({...editingItem, quantity: editingItem.quantity + 1})} className="p-3 text-slate-400"><Icon name="Plus" className="w-4 h-4"/></button>
                                            </div>
                                        </div>
                                        <div className="col-span-5 space-y-1">
                                            <label className="text-[9px] font-black text-slate-500 uppercase block ml-1">Unit</label>
                                            <select value={editingItem.unit || "ea"} onChange={e => setEditingItem({...editingItem, unit: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-xl text-sm font-bold appearance-none">
                                                <option value="ea">ea</option><option value="lb">lb</option><option value="oz">oz</option><option value="pk">pk</option><option value="gal">gal</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div><label className="text-[9px] font-black text-slate-500 uppercase block ml-1">Price ($)</label><input type="number" step="0.01" value={editingItem.price} onChange={e => setEditingItem({...editingItem, price: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-xl text-sm font-black" /></div>
                                    <div><label className="text-[9px] font-black text-slate-500 uppercase block ml-1">Store</label><select value={editingItem.store} onChange={e => setEditingItem({...editingItem, store: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-xl text-sm font-bold appearance-none transition-all">{stores.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}</select></div>
                                    <div><label className="text-[9px] font-black text-slate-500 uppercase block ml-1">Aisle</label><select value={editingItem.aisle} onChange={e => setEditingItem({...editingItem, aisle: e.target.value})} className="w-full p-4 bg-slate-50 border rounded-xl text-sm font-bold appearance-none transition-all">{AISLE_ORDER.map(a => <option key={a} value={a}>{a}</option>)}</select></div>
                                    <button onClick={saveModalChanges} className="w-full bg-emerald-600 text-white font-black py-4 rounded-xl uppercase text-[10px] active:scale-95 transition-all shadow-lg shadow-emerald-100">Save Changes</button>
                                    <button onClick={() => setEditingItem(null)} className="w-full py-2 text-slate-400 text-[10px] font-black uppercase tracking-widest text-center">Cancel</button>
                                    <button onClick={() => {deleteItem(editingItem.id); setEditingItem(null);}} className="w-full py-2 text-red-500 text-[10px] font-black uppercase tracking-widest opacity-60 hover:opacity-100 transition-opacity text-center">Delete Item</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GroceryListApp />);
    </script>
</body>
</html>
