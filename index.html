<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista | Smart Grocery App</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for Browser-side JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>
    
    <!-- SheetJS (XLSX) CDN -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .scale-in { animation: scaleIn 0.2s ease-out; }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        // Destructure Lucide icons from the global 'lucideReact' object
        const { 
            Plus, Trash2, Check, X, ShoppingCart, Edit2, 
            Menu, Search, Upload, Package, DollarSign 
        } = lucideReact;

        const GroceryListApp = () => {
            const [items, setItems] = useState([]);
            const [pantryItems, setPantryItems] = useState([]);
            const [newItem, setNewItem] = useState('');
            const [newQuantity, setNewQuantity] = useState('1');
            const [newPrice, setNewPrice] = useState('');
            const [selectedStore, setSelectedStore] = useState('Walmart');
            const [editingId, setEditingId] = useState(null);
            const [editText, setEditText] = useState('');
            const [editQuantity, setEditQuantity] = useState('');
            const [editPrice, setEditPrice] = useState('');
            const [editStore, setEditStore] = useState('');
            const [showMenu, setShowMenu] = useState(false);
            const [showPantry, setShowPantry] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');

            const stores = ['Walmart', "Sam's Club", 'Coquito', 'Talin Market'];

            const aisleMap = {
                'Dairy': ['milk', 'eggs', 'cheese', 'butter', 'yogurt', 'cream', 'half and half'],
                'Produce': ['apple', 'banana', 'orange', 'lettuce', 'tomato', 'onion', 'potato', 'carrot', 'broccoli', 'cilantro', 'lime', 'lemon', 'garlic'],
                'Meat': ['chicken', 'beef', 'pork', 'turkey', 'fish', 'salmon', 'steak', 'ground beef', 'chorizo', 'bacon', 'ham'],
                'Bakery': ['bread', 'bagel', 'muffin', 'croissant', 'donut', 'cake', 'roll', 'tortilla'],
                'Frozen': ['ice cream', 'frozen', 'pizza', 'fries', 'veggies', 'peas'],
                'Pantry': ['rice', 'pasta', 'cereal', 'oatmeal', 'flour', 'sugar', 'salt', 'oil', 'vinegar', 'honey'],
                'Beverages': ['water', 'juice', 'soda', 'coffee', 'tea', 'beer', 'wine', 'malta'],
                'Snacks': ['chips', 'crackers', 'cookies', 'candy', 'popcorn', 'nuts'],
                'Canned': ['soup', 'beans', 'corn', 'tuna', 'sauce', 'tomato paste'],
                'Pharmacy': ['aspirin', 'bandage', 'vitamin', 'shaving cream', 'razor', 'medicine', 'toothpaste', 'shampoo', 'soap']
            };

            const getAisleForItem = (itemName) => {
                const lowerName = itemName.toLowerCase();
                for (const [aisle, keywords] of Object.entries(aisleMap)) {
                    if (keywords.some(keyword => lowerName.includes(keyword))) return aisle;
                }
                return 'Other';
            };

            // Persistence
            useEffect(() => {
                const savedItems = localStorage.getItem('groceryItems');
                const savedPantry = localStorage.getItem('pantryItems');
                if (savedItems) setItems(JSON.parse(savedItems));
                if (savedPantry) setPantryItems(JSON.parse(savedPantry));
            }, []);

            useEffect(() => {
                localStorage.setItem('groceryItems', JSON.stringify(items));
            }, [items]);

            useEffect(() => {
                localStorage.setItem('pantryItems', JSON.stringify(pantryItems));
            }, [pantryItems]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                        
                        const newItems = jsonData.map((row, index) => ({
                            id: Date.now() + index,
                            name: String(row.Item || row.item || row.Name || row.name || '').trim(),
                            price: String(row.Price || row.price || '').trim()
                        })).filter(item => item.name);

                        setPantryItems(prev => [...prev, ...newItems]);
                        alert(`Imported ${newItems.length} items!`);
                    } catch (err) { alert("Error reading file."); }
                };
                reader.readAsArrayBuffer(file);
            };

            const addItem = () => {
                if (!newItem.trim()) return;
                const item = {
                    id: Date.now(),
                    name: newItem.trim(),
                    quantity: newQuantity || '1',
                    price: newPrice,
                    aisle: getAisleForItem(newItem),
                    store: selectedStore,
                    checked: false
                };
                setItems([item, ...items]);
                setNewItem('');
                setNewQuantity('1');
                setNewPrice('');
            };

            const addItemFromPantry = (pantryItem) => {
                const item = {
                    id: Date.now(),
                    name: pantryItem.name,
                    quantity: '1',
                    price: pantryItem.price || '',
                    aisle: getAisleForItem(pantryItem.name),
                    store: selectedStore,
                    checked: false
                };
                setItems([item, ...items]);
                setSearchQuery('');
            };

            const toggleCheck = (id) => {
                setItems(items.map(i => i.id === id ? { ...i, checked: !i.checked } : i));
            };

            const deleteItem = (id) => setItems(items.filter(i => i.id !== id));

            const saveEdit = () => {
                setItems(items.map(item =>
                    item.id === editingId
                        ? { ...item, name: editText, quantity: editQuantity, price: editPrice, store: editStore, aisle: getAisleForItem(editText) }
                        : item
                ));
                setEditingId(null);
            };

            const cartTotal = items.reduce((sum, item) => {
                const p = parseFloat(item.price) || 0;
                const q = parseFloat(item.quantity) || 1;
                return sum + (p * q);
            }, 0);

            const filteredPantry = searchQuery.length >= 2 
                ? pantryItems.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()))
                : [];

            const groupedByAisle = items
                .filter(i => !i.checked)
                .reduce((acc, item) => {
                    const aisle = item.aisle || 'Other';
                    if (!acc[aisle]) acc[aisle] = [];
                    acc[aisle].push(item);
                    return acc;
                }, {});

            return (
                <div className="min-h-screen pb-32">
                    <div className="max-w-2xl mx-auto p-4">
                        
                        {/* Header */}
                        <header className="rounded-2xl shadow-lg p-5 mb-4 text-white bg-gradient-to-br from-indigo-600 to-purple-700">
                            <div className="flex items-center justify-between mb-4">
                                <div className="flex items-center gap-3">
                                    <ShoppingCart className="w-6 h-6" />
                                    <h1 className="text-2xl font-black">MI LISTA</h1>
                                </div>
                                <button onClick={() => setShowMenu(!showMenu)} className="p-2 hover:bg-white/10 rounded-full">
                                    <Menu className="w-6 h-6" />
                                </button>
                            </div>

                            <div className="relative">
                                <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-white/60" />
                                <input
                                    type="text"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="Search pantry..."
                                    className="w-full pl-10 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-sm placeholder-white/60 focus:outline-none focus:bg-white/20 transition-all"
                                />
                                {filteredPantry.length > 0 && (
                                    <div className="absolute top-full left-0 right-0 mt-2 bg-white rounded-xl shadow-2xl border z-50 max-h-60 overflow-y-auto">
                                        {filteredPantry.map(p => (
                                            <button key={p.id} onClick={() => addItemFromPantry(p)} className="w-full flex justify-between p-4 hover:bg-indigo-50 border-b text-gray-800">
                                                <span className="font-bold">{p.name}</span>
                                                <Plus className="w-5 h-5 text-indigo-600" />
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </header>

                        {/* Dropdown Menu */}
                        {showMenu && (
                            <div className="mb-4 bg-white rounded-xl shadow-xl border overflow-hidden scale-in">
                                <button onClick={() => {setShowPantry(!showPantry); setShowMenu(false)}} className="w-full flex items-center gap-3 px-5 py-4 hover:bg-gray-50 border-b">
                                    <Package className="w-5 h-5 text-indigo-500" /> Pantry Database
                                </button>
                                <button onClick={() => {setItems(items.filter(i => !i.checked)); setShowMenu(false)}} className="w-full flex items-center gap-3 px-5 py-4 hover:bg-gray-50 border-b">
                                    <Check className="w-5 h-5 text-green-500" /> Clear Purchased
                                </button>
                                <button onClick={() => {if(confirm('Reset list?')) setItems([]); setShowMenu(false)}} className="w-full flex items-center gap-3 px-5 py-4 hover:bg-red-50 text-red-600">
                                    <Trash2 className="w-5 h-5" /> Reset All
                                </button>
                            </div>
                        )}

                        {/* Pantry View */}
                        {showPantry && (
                            <div className="bg-white rounded-xl shadow-md p-4 mb-4 border-2 border-indigo-100 scale-in">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="font-bold">Pantry Manager</h2>
                                    <label className="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer">
                                        Import Excel
                                        <input type="file" className="hidden" onChange={handleFileUpload} />
                                    </label>
                                </div>
                                <div className="max-h-40 overflow-y-auto space-y-2 custom-scrollbar">
                                    {pantryItems.map(p => (
                                        <div key={p.id} className="flex justify-between p-2 bg-slate-50 rounded">
                                            <span className="text-sm">{p.name}</span>
                                            <button onClick={() => setPantryItems(pantryItems.filter(i => i.id !== p.id))}><X className="w-4 h-4 text-red-400"/></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Entry Form */}
                        <div className="bg-white rounded-xl shadow-md p-3 mb-6 grid grid-cols-12 gap-2 border">
                            <input type="text" placeholder="Item..." value={newItem} onChange={e => setNewItem(e.target.value)} className="col-span-12 sm:col-span-5 p-2 border rounded-lg"/>
                            <input type="number" placeholder="Qty" value={newQuantity} onChange={e => setNewQuantity(e.target.value)} className="col-span-4 sm:col-span-2 p-2 border rounded-lg"/>
                            <input type="number" placeholder="$" value={newPrice} onChange={e => setNewPrice(e.target.value)} className="col-span-8 sm:col-span-2 p-2 border rounded-lg"/>
                            <button onClick={addItem} className="col-span-12 sm:col-span-3 bg-indigo-600 text-white font-bold rounded-lg py-2">Add Item</button>
                        </div>

                        {/* List Display */}
                        <div className="space-y-4">
                            {Object.entries(groupedByAisle).sort().map(([aisle, aisleItems]) => (
                                <div key={aisle} className="bg-white rounded-xl shadow-sm border overflow-hidden">
                                    <div className="px-4 py-1 bg-slate-100 text-[10px] font-black uppercase text-slate-500">{aisle}</div>
                                    <div className="divide-y">
                                        {aisleItems.map(item => (
                                            <div key={item.id} className="flex items-center gap-3 p-4">
                                                <button onClick={() => toggleCheck(item.id)} className="w-6 h-6 rounded-full border-2 border-indigo-400" />
                                                <div className="flex-1">
                                                    <p className="font-bold text-gray-800">{item.name}</p>
                                                    <p className="text-xs text-slate-400">{item.quantity} units • {item.store}</p>
                                                </div>
                                                <div className="text-right mr-2">
                                                    <p className="text-sm font-bold text-emerald-600">${(parseFloat(item.price || 0) * parseFloat(item.quantity)).toFixed(2)}</p>
                                                </div>
                                                <button onClick={() => {setEditingId(item.id); setEditText(item.name); setEditQuantity(item.quantity); setEditPrice(item.price); setEditStore(item.store)}} className="p-2 text-slate-400"><Edit2 className="w-4 h-4"/></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Purchased */}
                        {items.some(i => i.checked) && (
                            <div className="mt-8 opacity-50">
                                <h3 className="text-xs font-bold mb-2 uppercase text-slate-400">Purchased</h3>
                                <div className="bg-white rounded-xl border divide-y">
                                    {items.filter(i => i.checked).map(item => (
                                        <div key={item.id} className="flex items-center gap-3 p-3">
                                            <button onClick={() => toggleCheck(item.id)} className="w-6 h-6 rounded-full bg-emerald-500 flex items-center justify-center text-white"><Check className="w-4 h-4"/></button>
                                            <span className="line-through text-sm">{item.name}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Footer Total */}
                    {items.length > 0 && (
                        <div className="fixed bottom-0 inset-x-0 bg-white/80 backdrop-blur-lg border-t p-4 z-40">
                            <div className="max-w-2xl mx-auto flex justify-between items-center">
                                <div>
                                    <p className="text-[10px] font-black text-indigo-500 uppercase">Estimated Total</p>
                                    <p className="text-3xl font-black">${cartTotal.toFixed(2)}</p>
                                </div>
                                <div className="text-right">
                                    <p className="text-xs font-bold text-slate-400">{items.filter(i => i.checked).length} / {items.length} items</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Edit Modal */}
                    {editingId && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
                                <h2 className="text-xl font-black mb-4">Edit Item</h2>
                                <div className="space-y-4">
                                    <input type="text" value={editText} onChange={e => setEditText(e.target.value)} className="w-full p-3 border rounded-xl" />
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="number" value={editQuantity} onChange={e => setEditQuantity(e.target.value)} className="p-3 border rounded-xl" />
                                        <input type="number" value={editPrice} onChange={e => setEditPrice(e.target.value)} className="p-3 border rounded-xl" />
                                    </div>
                                    <button onClick={saveEdit} className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">Save</button>
                                    <button onClick={() => setEditingId(null)} className="w-full text-slate-400 py-2">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GroceryListApp />);
    </script>
</body>
</html>
